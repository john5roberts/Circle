<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle v1.33</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        repeating-linear-gradient(90deg, #c89a62 0px, #c89a62 42px, #c4925a 42px, #c4925a 84px),
        linear-gradient(180deg, #d1a46d 0%, #ba8450 100%);
    }
    .wrap { min-height: 100vh; padding: 8px; }
    .panel {
      width: min(100vw - 16px, 460px);
      margin: 0 auto;
      background: rgba(255,255,255,0.9);
      border-radius: 22px;
      padding: 8px;
    }
    svg { width: 100%; height: auto; display: block; }
    .label { pointer-events: none; user-select: none; }
    .clickable { cursor: pointer; }
    .active-wedge {
      filter:brightness(1.45) drop-shadow(0 0 7px rgba(255,255,255,.55));
    }
    .controls { display: flex; gap: 8px; align-items: center; margin: 10px 4px 0 4px; }
    .controls + .controls { margin-top: 8px; }
    .controls select, .controls button {
      font: inherit; font-size: 16px; border-radius: 10px; border: 1px solid #cbd5e1;
      background: white; padding: 10px 12px;
    }
    .controls select { flex: 1; min-width: 0; }
    .controls button { min-width: 78px; font-weight: 700; cursor: pointer; }
    .controls label {
      display: inline-flex; align-items: center; gap: 6px; font-size: 15px;
      background: white; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px;
      color: #111827;
    }

    :root {
      --board:#111315;
      --panel:#181b1e;
      --panel2:#202428;
      --line:#454b51;
      --text:#f2f4f5;
      --muted:#9aa1a7;
      --green:#27c96f;
      --greenDark:#153d29;
      --red:#ef4b4b;
      --redDark:#492020;
    }
    body {
      background:#0b0d0e !important;
      color:var(--text);
    }
    .wrap { padding:8px; background:#0b0d0e; }
    .panel {
      background:var(--board) !important;
      border:1px solid #30353a;
      box-shadow:0 10px 28px rgba(0,0,0,.38);
      color:var(--text);
    }
    #wheel { background:var(--board); border-radius:18px; }
    .controls select, .controls button, .controls label {
      background:var(--panel2) !important;
      color:var(--text) !important;
      border:1px solid var(--line) !important;
    }
    .controls select { color-scheme:dark; }
    .controls button { font-weight:800; }
    #playProgressionBtn {
      border-color:#737b82 !important;
    }
    #playProgressionBtn.playing {
      background:#e6e8ea !important;
      color:#111315 !important;
      border-color:#f5f6f7 !important;
      box-shadow:inset 0 0 0 1px #ffffff;
    }
    .controls label:has(input:checked) {
      background:#e6e8ea !important;
      border-color:#f5f6f7 !important;
      box-shadow:inset 0 0 0 1px #ffffff;
      color:#111315 !important;
    }
    input[type="checkbox"] { accent-color:#d8dcdf; }

    .progression-strip {
      display:flex;
      align-items:stretch;
      gap:5px;
      margin:8px 4px 2px 4px;
      min-height:54px;
    }
    .prog-chip {
      flex:1 1 0;
      min-width:0;
      border-radius:9px;
      border:1px solid #3d4348;
      background:#202428;
      color:#d8dcdf;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:7px 3px;
      font-size:16px;
      font-weight:800;
      line-height:1;
      flex-direction:column;
      gap:5px;
      transition:filter .08s, box-shadow .08s, transform .08s;
    }
    /* Progression strip: all inactive chords stay neutral.
       Green/red is reserved for the chord that is sounding now. */
    .prog-chip.in-key,
    .prog-chip.out-key {
      color:#b7bdc2;
      border-color:#3d4348;
      background:#202428;
    }
    .prog-chip .alteration {
      font-size:11px; font-weight:700; line-height:1; opacity:.78; white-space:nowrap;
    }
    .prog-chip.active.in-key {
      color:var(--green);
      border-color:#2b7d50;
      background:#14251c;
    }
    .prog-chip.active.out-key {
      color:var(--red);
      border-color:#8d3939;
      background:#291818;
    }
    .prog-chip.active {
      filter:brightness(1.35);
      box-shadow:0 0 0 2px currentColor, 0 0 8px currentColor;
      transform:translateY(-1px);
    }
    .active-wedge {
      filter:brightness(1.5) drop-shadow(0 0 8px currentColor) !important;
    }


    .source-select {
      position:absolute !important;
      width:1px !important;
      height:1px !important;
      opacity:0 !important;
      pointer-events:none !important;
      overflow:hidden !important;
    }
    .browser-trigger {
      flex:1;
      min-width:0;
      min-height:48px;
      text-align:left;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:3px;
      padding:8px 12px !important;
      background:#202428 !important;
      border:1px solid #4a5056 !important;
      color:#f2f4f5 !important;
      border-radius:10px;
      cursor:pointer;
    }
    .browser-trigger .trigger-label {
      font-size:10px;
      letter-spacing:.08em;
      color:#9aa1a7;
      font-weight:800;
      text-transform:uppercase;
      line-height:1;
    }
    .browser-trigger .trigger-value {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      font-size:15px;
      font-weight:800;
      line-height:1.15;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .browser-trigger .trigger-value .main-value {
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .browser-trigger .trigger-arrow {
      flex:0 0 auto;
      color:#c7ccd0;
      font-size:13px;
    }

    .choice-overlay {
      position:fixed;
      inset:0;
      z-index:5000;
      background:rgba(0,0,0,.68);
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding:10px;
    }
    .choice-overlay.open { display:flex; }
    .choice-sheet {
      width:min(100%,520px);
      max-height:min(82vh,760px);
      background:#111315;
      border:1px solid #454b51;
      border-radius:18px;
      box-shadow:0 16px 42px rgba(0,0,0,.55);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .choice-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:13px 14px 10px;
      border-bottom:1px solid #30353a;
    }
    .choice-title {
      font-size:17px;
      font-weight:900;
      color:#f2f4f5;
    }
    .choice-close {
      border:1px solid #565d63;
      background:#202428;
      color:#f2f4f5;
      border-radius:9px;
      padding:7px 11px;
      font:inherit;
      font-weight:800;
    }
    .choice-tabs {
      display:flex;
      gap:7px;
      overflow-x:auto;
      padding:10px 12px;
      border-bottom:1px solid #30353a;
      scrollbar-width:none;
    }
    .choice-tabs::-webkit-scrollbar { display:none; }
    .choice-tab {
      flex:0 0 auto;
      border:1px solid #4b5258;
      background:#1b1f22;
      color:#c6cbd0;
      border-radius:999px;
      padding:8px 11px;
      font:inherit;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .choice-tab.active {
      background:#e6e8ea;
      color:#111315;
      border-color:#fff;
    }
    .choice-grid {
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding:12px;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:9px;
      min-height:180px;
    }
    .choice-item {
      min-height:62px;
      border:1px solid #454b51;
      background:#1b1f22;
      color:#f2f4f5;
      border-radius:11px;
      padding:9px 8px;
      font:inherit;
      text-align:center;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:5px;
      cursor:pointer;
    }
    .choice-item.selected {
      border-color:#fff;
      box-shadow:inset 0 0 0 1px #fff;
      background:#2b3034;
    }
    .choice-item .choice-name {
      font-size:13px;
      line-height:1.15;
      font-weight:850;
    }
    .choice-item .choice-detail {
      font-size:10px;
      line-height:1.1;
      color:#aeb4b9;
      font-weight:700;
    }
    .choice-foot {
      display:flex;
      gap:8px;
      padding:10px 12px 12px;
      border-top:1px solid #30353a;
    }
    .choice-foot button {
      flex:1;
      border-radius:10px;
      padding:11px 12px;
      font:inherit;
      font-weight:850;
      background:#202428;
      color:#f2f4f5;
      border:1px solid #565d63;
    }
    .choice-foot .done {
      background:#e6e8ea;
      color:#111315;
      border-color:#fff;
    }
    @media (max-width:380px) {
      .choice-grid { grid-template-columns:1fr; }
    }


    .sample-status {
      margin: 6px 4px 8px;
      padding: 7px 10px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 800;
      color: #202428;
      background: #e7e9eb;
      border: 1px solid #aeb4b9;
      border-radius: 9px;
      letter-spacing: .01em;
    }
    .sample-status::before {
      content: "●";
      font-size: 9px;
      color: #7a8187;
    }
    .sample-status.ready {
      color: #202428;
      background: #f2f3f4;
      border-color: #6f767c;
    }
    .sample-status.ready::before { color: #4f565c; }
    .sample-status.fallback {
      color: #202428;
      background: #dedfe1;
      border-color: #8e9499;
    }
    .sample-status.fallback::before { color: #5f666c; }

  </style>
</head>

    var PC_MAP = {C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,"F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11};

    function displayPitchClass(pc, preference, conventionalName) {
      pc = ((pc % 12) + 12) % 12;
      if (preference === "sharp") return SHARP_PC_NAMES[pc];
      if (preference === "flat") return FLAT_PC_NAMES[pc];
      return conventionalName || FLAT_PC_NAMES[pc];
    }

    function displayMajorForCanonical(canonicalMajor) {
      return displayPitchClass(PC_MAP[canonicalMajor], selectedSpellingPreference, canonicalMajor);
    }

    function displayMinorForCanonical(canonicalMinor) {
      var root = canonicalMinor.slice(0,-1);
      return displayPitchClass(PC_MAP[root], selectedSpellingPreference, root) + "m";
    }

    function setSpellingFromSelectedDisplay(displayName, canonicalKey) {
      if (displayName.indexOf("#") !== -1) selectedSpellingPreference = "sharp";
      else if (displayName.indexOf("b") !== -1) selectedSpellingPreference = "flat";
      else selectedSpellingPreference = conventionalPreferenceForKey(canonicalKey);
    }

    function activeChordDisplayName() {
      if (activePitchClass === null) return "";

    function parseKey(value) {
      var raw = (value || "C").replace(/♯/g, "#").replace(/♭/g, "b").trim();
      var normalized = raw ? raw.charAt(0).toUpperCase() + raw.slice(1) : "C";
      if (MAJOR_KEYS.indexOf(normalized) !== -1) return normalized;

    }
    function getAudioCtx() {

        }
      } catch (e) {}
      if (callback) callback(ctx);
    }
    // Optional sampled acoustic guitar. Synthetic remains the default and fallback.
    // Same Karoryfer Shinyguitar sample set used by Voicing Navigator.
    var GUITAR_SAMPLE_DEFS = [
      {midi:48,url:"https://raw.githubusercontent.com/sfzinstruments/karoryfer.shinyguitar/master/Samples/acoustic/c3_vl3_rr1_1.wav"},
      {midi:51,url:"https://raw.githubusercontent.com/sfzinstruments/karoryfer.shinyguitar/master/Samples/acoustic/eb3_vl3_rr1_1.wav"},
      {midi:54,url:"https://raw.githubusercontent.com/sfzinstruments/karoryfer.shinyguitar/master/Samples/acoustic/gb3_vl3_rr1_1.wav"},
      {midi:57,url:"https://raw.githubusercontent.com/sfzinstruments/karoryfer.shinyguitar/master/Samples/acoustic/a3_vl3_rr1_1.wav"}
    ];

    function loadGuitarSamples(ctx) {
      if (guitarSampleBuffers.size === GUITAR_SAMPLE_DEFS.length) return Promise.resolve(true);
      if (guitarSamplesPromise) return guitarSamplesPromise;
      guitarSamplesPromise = Promise.all(GUITAR_SAMPLE_DEFS.map(function(def){
        return fetch(def.url,{mode:"cors",cache:"force-cache"})
          .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.arrayBuffer(); })
          .then(function(ab){ return ctx.decodeAudioData(ab.slice(0)); })
          .then(function(buf){ guitarSampleBuffers.set(def.midi,buf); });
      })).then(function(){ return true; }).catch(function(err){
        console.warn("Sampled guitar unavailable; using synthetic fallback.",err);
        return false;
      }).finally(function(){ guitarSamplesPromise=null; });
      return guitarSamplesPromise;

    // Local percussion samples served from this repository.
    // Folder structure:
    // samples/drums/kick.wav
    // samples/drums/snare.wav
    // samples/drums/hihat.wav
    var PERCUSSION_SAMPLE_DEFS = {
      kick: "samples/drums/kick.wav",
      snare: "samples/drums/snare.wav",
      hat: "samples/drums/hihat.wav"

    var percussionSampleBuffers = new Map();
    var percussionSamplesPromise = null;

    function setPercussionSampleStatus(text, stateClass) {
      var el = document.getElementById("sampleStatus");

      el.className = "sample-status" + (stateClass ? " " + stateClass : "");
    }

    function loadPercussionSamples(ctx) {
      if (percussionSampleBuffers.size === 3) {
        setPercussionSampleStatus("Drums: samples ready", "ready");
        return Promise.resolve(true);
      }
      if (percussionSamplesPromise) return percussionSamplesPromise;

      setPercussionSampleStatus("Drums: loading samples…", "");

      var entries = Object.keys(PERCUSSION_SAMPLE_DEFS);
      percussionSamplesPromise = Promise.all(entries.map(function(kind){
        var url = PERCUSSION_SAMPLE_DEFS[kind];
        return fetch(url, {cache:"force-cache"})
          .then(function(r){
            if (!r.ok) throw new Error(url + " HTTP " + r.status);
            return r.arrayBuffer();

          .then(function(ab){ return ctx.decodeAudioData(ab.slice(0)); })
          .then(function(buf){ percussionSampleBuffers.set(kind, buf); });

        setPercussionSampleStatus("Drums: samples ready", "ready");
        return true;
      }).catch(function(err){
        console.warn("Local percussion samples unavailable; using synth fallback.", err);

    function playSampledPercussionHit(ctx, when, kind) {

      var gain = ctx.createGain();
      src.buffer = buf;

      var level = kind === "kick" ? 0.72 : (kind === "snare" ? 0.52 : 0.30);
      gain.gain.setValueAtTime(level, when);

      src.connect(gain);
      gain.connect(masterGain || ctx.destination);
      src.start(when);

      trackPercussionSource(src, gain, ctx);
      return true;

    function nearestGuitarSample(midi) {
      var best=null;
      for (var i=0;i<GUITAR_SAMPLE_DEFS.length;i++) {
        var def=GUITAR_SAMPLE_DEFS[i];
        if (!guitarSampleBuffers.has(def.midi)) continue;
        var distance=Math.abs(midi-def.midi);
        if (!best || distance<best.distance) best={def:def,distance:distance};
      }
      return best;
    }

    function playSampledTone(ctx,midi,when,volume,targetArray,duration) {
      var pick=nearestGuitarSample(midi);
      if (!pick) return false;

      var src=ctx.createBufferSource(), gain=ctx.createGain();
      src.buffer=guitarSampleBuffers.get(pick.def.midi);
      src.playbackRate.value=Math.pow(2,(midi-pick.def.midi)/12);

      // Gate the recorded guitar so one harmony does not ring into the next.
      // Keep a short natural body, then use a 50 ms release.
      var noteDuration = Math.max(0.09, duration || 0.45);
      var fadeTime = Math.min(0.05, noteDuration * 0.25);
      var fadeStart = when + Math.max(0.04, noteDuration - fadeTime);
      var stopAt = when + noteDuration + 0.012;

      gain.gain.cancelScheduledValues(when);
      gain.gain.setValueAtTime(volume, when);
      gain.gain.setValueAtTime(volume, fadeStart);
      gain.gain.linearRampToValueAtTime(0.0001, when + noteDuration);

      src.connect(gain);
      gain.connect(masterGain || ctx.destination);
      src.start(when);
      try { src.stop(stopAt); } catch(e) {}

      var sampleItem={osc:src,gain:gain,ctx:ctx};
      targetArray.push(sampleItem);
      src.onended=function(){
        var ix=targetArray.indexOf(sampleItem);
        if(ix!==-1) targetArray.splice(ix,1);
      };
      return true;
    }

    function midiToFreq(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }
    function text(svg, x, y, str, opts) {
      opts = opts || {};

    function wedgePath(cx, cy, rInner, rOuter, startAngle, endAngle) {
      var x1o = cx + Math.cos(startAngle) * rOuter, y1o = cy + Math.sin(startAngle) * rOuter;
      var x2o = cx + Math.cos(endAngle) * rOuter, y2o = cy + Math.sin(endAngle) * rOuter;
      var x2i = cx + Math.cos(endAngle) * rInner, y2i = cy + Math.sin(endAngle) * rInner;
      var x1i = cx + Math.cos(startAngle) * rInner, y1i = cy + Math.sin(startAngle) * rInner;
      return "M " + x1o + " " + y1o + " A " + rOuter + " " + rOuter + " 0 0 1 " + x2o + " " + y2o + " L " + x2i + " " + y2i + " A " + rInner + " " + rInner + " 0 0 0 " + x1i + " " + y1i + " Z";
    }
    function wedge(svg, cx, cy, rInner, rOuter, startAngle, endAngle, fill, stroke, sw) {

    function playSingleTone(ctx, midi, duration, targetArray, startWhen, role) {
      var now = startWhen || ctx.currentTime;
      var noteRole = role || "arp";

      // Bass and metronome always remain synthetic.
      // Only chord/arp guitar voices use the recorded guitar samples.
      if (selectedInstrument() === "sampled" && noteRole !== "metro" && noteRole !== "bass") {
        var sampleVol = noteRole === "chord" ? 0.16 : 0.18;
        if (playSampledTone(ctx,midi,now,sampleVol,targetArray,duration)) return;
        // If samples are unavailable, fall through to the original synth.
      }

      var fundamental = ctx.createOscillator(), overtone1 = ctx.createOscillator(), overtone2 = ctx.createOscillator();
      var gain = ctx.createGain(), filter = ctx.createBiquadFilter();
      var pickFilter = ctx.createBiquadFilter(), pickGain = ctx.createGain();
      var mix1 = ctx.createGain(), mix2 = ctx.createGain(), mix3 = ctx.createGain();

      fundamental.type = "triangle";
      overtone1.type = "sawtooth";
      overtone2.type = "triangle";
      filter.type = noteRole === "bass" ? "lowpass" : "bandpass";
      filter.frequency.setValueAtTime(noteRole === "bass" ? 900 : 1850, now);
      filter.Q.value = noteRole === "bass" ? 0.7 : 1.15;

      var freq = midiToFreq(midi);
      fundamental.frequency.value = freq;
      overtone1.frequency.value = freq * 2;
      overtone2.frequency.value = freq * 3;

      var peak = 0.12;
      var sustain = 0.035;
      if (noteRole === "chord") { peak = 0.17; sustain = 0.02; }
      if (noteRole === "bass") { peak = 0.14; sustain = 0.045; }
      if (noteRole === "metro") { peak = 0.05; sustain = 0.015; }

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(peak, now + 0.004);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.001, peak * 0.28), now + sustain);
      gain.gain.exponentialRampToValueAtTime(0.001, now + Math.max(0.08, duration));

      pickFilter.type = "highpass";
      pickFilter.frequency.setValueAtTime(2800, now);
      pickGain.gain.setValueAtTime(0.0001, now);
      pickGain.gain.linearRampToValueAtTime(noteRole === "bass" ? 0.008 : 0.018, now + 0.002);
      pickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.018);

      mix1.gain.value = noteRole === "bass" ? 0.95 : 0.72;
      mix2.gain.value = noteRole === "bass" ? 0.12 : 0.22;
      mix3.gain.value = noteRole === "bass" ? 0.05 : 0.10;

      fundamental.connect(mix1);
      overtone1.connect(mix2);
      overtone2.connect(mix3);
      mix1.connect(filter);
      mix2.connect(filter);
      mix3.connect(filter);
      filter.connect(gain);
      gain.connect(masterGain || ctx.destination);

      overtone1.connect(pickFilter);
      pickFilter.connect(pickGain);
      pickGain.connect(masterGain || ctx.destination);

      fundamental.start(now);
      overtone1.start(now);
      overtone2.start(now);
      fundamental.stop(now + Math.max(0.09, duration) + 0.03);
      overtone1.stop(now + Math.max(0.09, duration) + 0.03);
      overtone2.stop(now + Math.max(0.09, duration) + 0.03);

      var voiceItems = [
        { osc: fundamental, gain: gain, ctx: ctx },
        { osc: overtone1, gain: gain, ctx: ctx },
        { osc: overtone2, gain: gain, ctx: ctx }
      ];
      for (var vi=0; vi<voiceItems.length; vi++) targetArray.push(voiceItems[vi]);

      // Long-running transport: remove every finished musical oscillator
      // reference so the tracking array remains bounded.
      if (noteRole === "bass" || noteRole === "chord" || noteRole === "arp") {
        voiceItems.forEach(function(item){
          item.osc.onended = function(){
            var ix = targetArray.indexOf(item);
            if (ix !== -1) targetArray.splice(ix,1);
          };
        });
      }

      var cfg = selectorBrowserConfig[select.id];
      if (!cfg) return;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "browser-trigger";
      btn.id = select.id + "Trigger";
      btn.innerHTML =
        '<span class="trigger-label">'+cfg.label+'</span>'+
        '<span class="trigger-value"><span class="main-value"></span><span class="trigger-arrow">▾</span></span>';
      select.parentNode.insertBefore(btn, select);
      btn.addEventListener("click", function(){ openChoiceBrowser(select.id); });
      updateTrigger(select);
    }

    function updateTrigger(select) {
      var btn = document.getElementById(select.id + "Trigger");
      var opt = selectedOptionFor(select);
      if (!btn || !opt) return;
      var main = btn.querySelector(".main-value");
      var cat = optionCategory(opt);
      var label = opt.textContent.trim();
      main.textContent = cat + " · " + label;
    }

    function optionDetail(select, opt) {
      if (select.id === "progressionSelect") {
        var parts = opt.value.split("|");
        var beats = parts[1] ? parts[1].split(",").join(" · ") : "";
        return beats ? beats + " beats" : "";
      }
      if (select.id === "guitarPatternSelect") {
        var tokens = opt.value.split(",");
        var b=0,c=0,a=0;
        tokens.forEach(function(tok){
          if(tok.indexOf("B@")===0) b++;
          else if(tok.indexOf("C@")===0) c++;
          else if(tok.indexOf("A")===0) a++;
        });
        var bits=[];
        if(b) bits.push(b+" bass");
        if(c) bits.push(c+" chord");
        if(a) bits.push(a+" arp");
        return bits.join(" · ");
      }
      var p = opt.value.split("|");
      return p[0].replace(/_/g," ");
    }

    function browserCategories(select) {
      var cats = [];
      var seen = {};
      Array.prototype.forEach.call(select.options,function(opt){
        var c=optionCategory(opt);
        if(!seen[c]) { seen[c]=true; cats.push(c); }
      });
      var cfg=selectorBrowserConfig[select.id];
      if(readRecentValues(cfg.recentKey).length) cats.unshift("Recent");
      return cats;
    }

    function optionsForBrowserCategory(select, category) {
      if (category === "Recent") {
        var cfg=selectorBrowserConfig[select.id], vals=readRecentValues(cfg.recentKey), out=[];
        vals.forEach(function(v){
          for(var i=0;i<select.options.length;i++){
            if(select.options[i].value===v){ out.push(select.options[i]); break; }
          }
        });
        return out;
      }
      return Array.prototype.filter.call(select.options,function(opt){
        return optionCategory(opt) === category;
      });
    }

    function renderBrowserTabs() {
      var host=document.getElementById("choiceTabs");
      host.innerHTML="";
      var cats=browserCategories(activeBrowserSelect);
      if(!activeBrowserCategory || cats.indexOf(activeBrowserCategory)===-1) {
        activeBrowserCategory=optionCategory(selectedOptionFor(activeBrowserSelect));
        if(cats.indexOf(activeBrowserCategory)===-1) activeBrowserCategory=cats[0];
      }
      cats.forEach(function(cat){
        var b=document.createElement("button");
        b.type="button";
        b.className="choice-tab"+(cat===activeBrowserCategory?" active":"");
        b.textContent=cat;
        b.addEventListener("click",function(){
          activeBrowserCategory=cat;
          renderBrowserTabs();
          renderBrowserGrid();
        });
        host.appendChild(b);
      });
    }

    function applyBrowserSelection(opt) {
      if(!activeBrowserSelect || !opt) return;
      activeBrowserSelect.value=opt.value;
      rememberRecent(activeBrowserSelect,opt.value);
      updateTrigger(activeBrowserSelect);

      // Reuse each source select's normal change behavior.
      try {
        activeBrowserSelect.dispatchEvent(new Event("change",{bubbles:true}));
      } catch(e) {
        var evt=document.createEvent("Event"); evt.initEvent("change",true,true);
        activeBrowserSelect.dispatchEvent(evt);
      }
      renderBrowserTabs();
      renderBrowserGrid();
    }

    function renderBrowserGrid() {
      var host=document.getElementById("choiceGrid");
      host.innerHTML="";
      var opts=optionsForBrowserCategory(activeBrowserSelect,activeBrowserCategory);
      opts.forEach(function(opt){
        var b=document.createElement("button");
        b.type="button";
        b.className="choice-item"+(opt.value===activeBrowserSelect.value?" selected":"");
        var nm=document.createElement("div"); nm.className="choice-name"; nm.textContent=opt.textContent.trim();
        var detail=document.createElement("div"); detail.className="choice-detail"; detail.textContent=optionDetail(activeBrowserSelect,opt);
        b.appendChild(nm);
        if(detail.textContent) b.appendChild(detail);
        b.addEventListener("click",function(){ applyBrowserSelection(opt); });
        host.appendChild(b);
      });
    }

    function openChoiceBrowser(selectId) {
      activeBrowserSelect=document.getElementById(selectId);
      if(!activeBrowserSelect) return;
      var cfg=selectorBrowserConfig[selectId];
      document.getElementById("choiceTitle").textContent=cfg.title;
      activeBrowserCategory=optionCategory(selectedOptionFor(activeBrowserSelect));
      browserWasPlaying=progressionPlaying;
      renderBrowserTabs();
      renderBrowserGrid();
      var ov=document.getElementById("choiceOverlay");
      ov.classList.add("open");
      ov.setAttribute("aria-hidden","false");
    }

    function closeChoiceBrowser() {
      var ov=document.getElementById("choiceOverlay");
      ov.classList.remove("open");
      ov.setAttribute("aria-hidden","true");
      activeBrowserSelect=null;
      activeBrowserCategory=null;
      if(progressionPlaying && !browserWasPlaying) stopProgressionPlayback();
      browserWasPlaying=false;
    }

    function toggleBrowserPreview() {
      var btn=document.getElementById("choicePreview");
      if(progressionPlaying) {
        stopProgressionPlayback();
        if(btn) btn.textContent="Preview";
      } else {
        startProgressionLoop();
        if(btn) btn.textContent="Stop Preview";
      }
    }

    function initChoiceBrowsers() {
      ["progressionSelect","guitarPatternSelect","rhythmSelect"].forEach(function(id){
        var s=document.getElementById(id);
        if(s && !document.getElementById(id+"Trigger")) makeTrigger(s);
      });

      var closeBtn=document.getElementById("choiceClose");
      var doneBtn=document.getElementById("choiceDone");
      var previewBtn=document.getElementById("choicePreview");
      var overlay=document.getElementById("choiceOverlay");

      if(closeBtn) closeBtn.addEventListener("click",closeChoiceBrowser);
      if(doneBtn) doneBtn.addEventListener("click",closeChoiceBrowser);
      if(previewBtn) previewBtn.addEventListener("click",toggleBrowserPreview);
      if(overlay) overlay.addEventListener("click",function(e){
        if(e.target===this) closeChoiceBrowser();
      });

      // Start with the accompaniment assigned to the default progression.
      applyAssociatedAccompanimentForProgression();
    }



    // ---------- Instrument renderer layer ----------
    // The transport decides WHAT happens and WHEN. These functions decide
    // HOW each event is rendered. External sample files can plug in here
    // later without changing the transport or musical pattern logic.

    function renderPercussionEvent(ctx, when, kind) {
      if (playSampledPercussionHit(ctx, when, kind)) return;
      playPercussionHit(ctx, when, kind);
    }

    function renderBassEvent(ctx, midi, duration, when) {
      playSingleTone(
        ctx, midi, duration, progressionOscillators, when, "bass"
      );
    }

    function renderGuitarChordEvent(ctx, midiNotes, duration, when) {
      for (var n=0; n<midiNotes.length; n++) {
        playSingleTone(
          ctx,
          midiNotes[n],
          duration,
          progressionOscillators,
          when + n * 0.018,
          "chord"
        );
      }
    }

    function renderGuitarArpEvent(ctx, midi, duration, when) {
      playSingleTone(
        ctx, midi, duration, progressionOscillators, when, "arp"
      );
    }

    // ---------- Continuous master transport ----------
    // Audio events are scheduled ahead on the AudioContext clock.
    // Graphics follow that same clock with requestAnimationFrame().
    // The transport emits musical events through the renderer layer above.
    var transportRunning = false;
    var transportTimer = null;
    var transportNextBeatTime = 0;
    var transportBeatNumber = 0;
    var transportLookaheadMs = 25;
    var transportScheduleAheadSec = 0.12;

    // Small timeline of beat boundaries already placed on the AudioContext
    // clock. The visual layer reads this rather than running its own timers.
    var transportVisualBeats = [];
    var transportVisualFrame = null;
    var transportVisualStateKey = "";

    function getTransportBeatSeconds() {
      var tempo = document.getElementById("tempoSelect");
      var bpm = tempo ? parseFloat(tempo.value) : 100;
      if (!isFinite(bpm) || bpm <= 0) bpm = 100;
      return 60 / bpm;
    }

    function scheduleTransportMetronomeBeat(ctx, when, beatNumber) {
      var toggle = document.getElementById("metronomeToggle");
      if (!toggle || !toggle.checked) return;
      playMetronomeClick(ctx, when, (beatNumber % 4) === 0);
    }

    function selectedPercussionFamily() {
      var select = document.getElementById("rhythmSelect");
      if (!select || select.selectedIndex < 0) return "Straight / Basic";
      var opt = select.options[select.selectedIndex];
      var parent = opt ? opt.parentElement : null;
      return (parent && parent.tagName === "OPTGROUP") ? parent.label : "Straight / Basic";
    }

    function scheduleTurnaroundHit(ctx, baseWhen, beatSeconds, fraction, kind) {
      var hitWhen = baseWhen + beatSeconds * fraction;
      renderPercussionEvent(ctx, hitWhen, kind);
    }

    function scheduleTransportTurnaroundBeat(ctx, when, beatNumber, beatSeconds) {
      var position = transportProgressionPosition(beatNumber);
      if (!position || position.totalBeats < 2) return;

      var beatsLeft = position.totalBeats - position.beatInPhrase;
      var subtle = (position.phrasePass % 2 === 0);
      var family = selectedPercussionFamily();

      // First phrase ending = subtle; second phrase ending = stronger;
      // then alternate forever. The turnaround occupies existing beats only.
      if (subtle) {
        if (beatsLeft !== 1) return;

        if (family === "Brazilian / Latin") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.50,"hat");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"snare");
        } else if (family === "Jazz / Swing") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.67,"hat");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.83,"snare");
        } else if (family === "Funk / Soul / R&B") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"snare");
        } else if (family === "Reggae / Other") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"hat");
        } else {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"snare");
        }
        return;
      }

      // Stronger turnaround spans the final two beats of every second pass.
      if (beatsLeft === 2) {
        if (family === "Brazilian / Latin") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.50,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"hat");
        } else if (family === "Jazz / Swing") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.67,"snare");
        } else if (family === "Funk / Soul / R&B") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.50,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"hat");
        } else if (family === "Pop / Rock") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.50,"snare");
        } else if (family === "Folk / Country") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.50,"hat");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"snare");
        } else {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.50,"snare");
        }
      } else if (beatsLeft === 1) {
        if (family === "Brazilian / Latin") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.25,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.50,"hat");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.875,"hat");
        } else if (family === "Jazz / Swing") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.33,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.67,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.83,"hat");
        } else if (family === "Funk / Soul / R&B") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.25,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.50,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"snare");
        } else if (family === "Pop / Rock") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.25,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.50,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.875,"kick");
        } else if (family === "Folk / Country") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.50,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"snare");
        } else if (family === "Reggae / Other") {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.50,"hat");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"snare");
        } else {
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.25,"snare");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.50,"hat");
          scheduleTurnaroundHit(ctx,when,beatSeconds,0.75,"snare");
        }
      }
    }

    function scheduleTransportPercussionBeat(ctx, when, beatNumber, beatSeconds) {
      var toggle = document.getElementById("percussionToggle");
      if (!toggle || !toggle.checked) return;

      var percussionPattern = selectedPercussionPatternName();
      var beatInBar = beatNumber % 4;

      // Preserve the existing percussion behavior while moving its timing
      // completely onto the AudioContext transport.
      if (percussionPattern === "bossa") {
        if (beatInBar === 0 || beatInBar === 2) {
          renderPercussionEvent(ctx, when, "kick");
        }
        if (beatInBar === 1 || beatInBar === 3) {
          renderPercussionEvent(ctx, when, "snare");
        }
      } else if (percussionPattern === "reggae" || percussionPattern === "reggaeish") {
        if (beatInBar === 2) {
          renderPercussionEvent(ctx, when, "kick");
          renderPercussionEvent(ctx, when, "snare");
        }
      } else {
        if (beatInBar === 0 || beatInBar === 2) {
          renderPercussionEvent(ctx, when, "kick");
        }
        if (beatInBar === 1 || beatInBar === 3) {
          renderPercussionEvent(ctx, when, "snare");
        }
      }

      // Existing eighth-note hi-hat pulse, now scheduled directly on the
      // audio clock rather than by two JavaScript timers per beat.
      renderPercussionEvent(ctx, when, "hat");
      renderPercussionEvent(ctx, when + beatSeconds * 0.5, "hat");

      // Phrase-ending fill, synchronized to the same master transport.
      scheduleTransportTurnaroundBeat(ctx, when, beatNumber, beatSeconds);
    }

    function transportProgressionPosition(beatNumber) {
      var prog = getSelectedProgression();
      if (!prog || !prog.degrees.length) return null;

      var counts = [];
      var totalBeats = 0;
      for (var i=0; i<prog.degrees.length; i++) {
        var n = parseInt(prog.beats[i],10);
        if (!isFinite(n) || n < 1) n = 1;
        counts.push(n);
        totalBeats += n;
      }
      if (totalBeats < 1) return null;

      var beatInPhrase = ((beatNumber % totalBeats) + totalBeats) % totalBeats;
      var cursor = 0;
      for (var j=0; j<counts.length; j++) {
        if (beatInPhrase < cursor + counts[j]) {
          return {
            chordIndex:j,
            degree:prog.degrees[j],
            beatInChord:beatInPhrase-cursor,
            beatsForChord:counts[j],
            beatInPhrase:beatInPhrase,
            phrasePass:Math.floor(beatNumber/totalBeats),
            totalBeats:totalBeats
          };
        }
        cursor += counts[j];
      }
      return null;
    }

    function scheduleTransportBassBeat(ctx, when, beatNumber, beatSeconds) {
      var bassToggle = document.getElementById("bassToggle");
      if (!bassToggle || !bassToggle.checked) return;

      var position = transportProgressionPosition(beatNumber);
      if (!position) return;

      var events = selectedGuitarPatternEvents();
      if (!events.length) return;

      var info = chordInfoForDegree(selectedMajor, position.degree);
      if (!info || !info.midiNotes || !info.midiNotes.length) return;

      // Guitar patterns repeat every four beats WITHIN each chord. For the
      // current transport beat, schedule any B@... attack whose absolute
      // pattern position falls inside this beat, including half-beat attacks.
      for (var i=0; i<events.length; i++) {
        if (events[i].kind !== "B") continue;

        for (var base=0; base<position.beatsForChord; base+=4) {
          var pos = base + events[i].beat;
          if (pos >= position.beatsForChord) continue;
          if (Math.floor(pos + 1e-9) !== position.beatInChord) continue;

          var fraction = pos - position.beatInChord;
          var noteWhen = when + fraction * beatSeconds;
          var remaining = (position.beatsForChord - pos) * beatSeconds;
          var bassDur = Math.max(0.07, Math.min(beatSeconds * 0.68, remaining - 0.025));

          renderBassEvent(
            ctx,
            info.midiNotes[0] - 12,
            bassDur,
            noteWhen
          );
        }
      }
    }

    function scheduleTransportGuitarBeat(ctx, when, beatNumber, beatSeconds) {
      var chordToggle = document.getElementById("chordToggle");
      if (!chordToggle || !chordToggle.checked) return;

      var position = transportProgressionPosition(beatNumber);
      if (!position) return;

      var events = selectedGuitarPatternEvents();
      if (!events.length) return;

      var info = chordInfoForDegree(selectedMajor, position.degree);
      if (!info || !info.midiNotes || !info.midiNotes.length) return;

      // C@... and A0/A1/A2@... events repeat every four beats WITHIN
      // the current chord. Fractional positions are scheduled directly
      // against this transport beat's exact AudioContext time.
      for (var i=0; i<events.length; i++) {
        var kind = events[i].kind;
        if (kind === "B") continue;

        for (var base=0; base<position.beatsForChord; base+=4) {
          var pos = base + events[i].beat;
          if (pos >= position.beatsForChord) continue;
          if (Math.floor(pos + 1e-9) !== position.beatInChord) continue;

          var fraction = pos - position.beatInChord;
          var noteWhen = when + fraction * beatSeconds;
          var remaining = (position.beatsForChord - pos) * beatSeconds;

          if (kind === "C") {
            var chordDur = Math.max(
              0.07,
              Math.min(beatSeconds * 0.50, remaining - 0.065)
            );

            renderGuitarChordEvent(
              ctx,
              info.midiNotes,
              chordDur,
              noteWhen
            );
          } else if (kind.charAt(0) === "A") {
            var a = parseInt(kind.slice(1),10);
            a = Math.max(
              0,
              Math.min(info.midiNotes.length-1, isFinite(a) ? a : 0)
            );
            var arpDur = Math.max(
              0.07,
              Math.min(beatSeconds * 0.42, remaining - 0.025)
            );

            renderGuitarArpEvent(
              ctx,
              info.midiNotes[a],
              arpDur,
              noteWhen
            );
          }
        }
      }
    }



    function applyTransportVisualState(beatNumber) {
      var position = transportProgressionPosition(beatNumber);
      if (!position) return;

      var info = chordInfoForDegree(selectedMajor, position.degree);
      if (!info || !info.midiNotes || !info.midiNotes.length) return;

      // Preserve the requested progression-strip cue:
      // penultimate beat OFF, final beat ON.
      var lit = true;
      if (position.beatsForChord >= 3 &&
          position.beatInChord === position.beatsForChord - 2) {
        lit = false;
      }

      // Avoid rebuilding the SVG on every animation frame. Re-render only
      // when the chord position or cue state has actually changed.
      var stateKey = [
        position.chordIndex,
        position.beatInChord,
        lit ? 1 : 0,
        position.degree
      ].join("|");

      if (stateKey === transportVisualStateKey) return;
      transportVisualStateKey = stateKey;

      activeRoman = position.degree;
      activeChordKey = info.chordKey;
      activeChordRing = info.chordRing;
      activePitchClass = ((info.midiNotes[0] % 12) + 12) % 12;
      activeQuality = info.quality ||
        ((info.midiNotes[1] - info.midiNotes[0] === 3) ? "minor" : "major");
      activeIsDiatonic = isDegreeDiatonic(
        position.degree,
        progressionModeForDegrees(getSelectedProgression().degrees)
      );

      render(selectedMajor);
      renderProgressionStrip(position.chordIndex, lit);
    }

    function runTransportVisualFollower() {
      if (!transportRunning || !progressionPlaying) {
        transportVisualFrame = null;
        return;
      }

      var ctx = getAudioCtx();
      var now = ctx.currentTime;

      // Keep the current beat at [0]. Once the next beat boundary is actually
      // reached on the audio clock, advance to it. This remains correct even
      // if a browser frame is delayed or skipped.
      while (transportVisualBeats.length > 1 &&
             transportVisualBeats[1].time <= now) {
        transportVisualBeats.shift();
      }

      if (transportVisualBeats.length &&
          transportVisualBeats[0].time <= now) {
        applyTransportVisualState(transportVisualBeats[0].beatNumber);
      }

      transportVisualFrame = requestAnimationFrame(runTransportVisualFollower);
    }

    function startTransportVisualFollower() {
      if (transportVisualFrame !== null) {
        cancelAnimationFrame(transportVisualFrame);
      }
      transportVisualFrame = requestAnimationFrame(runTransportVisualFollower);
    }

    function stopTransportVisualFollower() {
      if (transportVisualFrame !== null) {
        cancelAnimationFrame(transportVisualFrame);
        transportVisualFrame = null;
      }
      transportVisualBeats = [];
      transportVisualStateKey = "";
    }

    function runTransportScheduler() {
      if (!transportRunning) return;
      var ctx = getAudioCtx();
      var beatSeconds = getTransportBeatSeconds();

      while (transportNextBeatTime < ctx.currentTime + transportScheduleAheadSec) {
        // Record the SAME beat boundary used by every audible layer.
        transportVisualBeats.push({
          time: transportNextBeatTime,
          beatNumber: transportBeatNumber,
          beatSeconds: beatSeconds
        });

        scheduleTransportMetronomeBeat(ctx, transportNextBeatTime, transportBeatNumber);
        scheduleTransportPercussionBeat(ctx, transportNextBeatTime, transportBeatNumber, beatSeconds);
        scheduleTransportBassBeat(ctx, transportNextBeatTime, transportBeatNumber, beatSeconds);
        scheduleTransportGuitarBeat(ctx, transportNextBeatTime, transportBeatNumber, beatSeconds);
        transportNextBeatTime += beatSeconds;
        transportBeatNumber++;
      }

      transportTimer = setTimeout(runTransportScheduler, transportLookaheadMs);
    }

    function startMasterTransport(ctx) {
      if (!ctx) ctx = getAudioCtx();

      transportRunning = true;
      transportBeatNumber = 0;
      transportVisualBeats = [];
      transportVisualStateKey = "";

      // All layers share this first exact beat boundary.
      transportNextBeatTime = ctx.currentTime + 0.05;

      if (transportTimer) clearTimeout(transportTimer);
      transportTimer = null;
      runTransportScheduler();
      startTransportVisualFollower();
    }

    function stopMasterTransport() {
      transportRunning = false;
      if (transportTimer) {
        clearTimeout(transportTimer);
        transportTimer = null;
      }
      stopTransportVisualFollower();
    }

    // ---------- Progression-specific accompaniment defaults ----------
    // Every progression phrase has one deliberate guitar and percussion pairing.

    function optionGroupLabel(opt) {
      return opt && opt.parentElement && opt.parentElement.tagName === "OPTGROUP"
        ? opt.parentElement.label : "Other";
    }

    function selectOptionByVisibleText(select, textValue) {
      if(!select) return false;
      for(var i=0;i<select.options.length;i++) {
        if(select.options[i].textContent.trim() === textValue) {
          select.selectedIndex=i;
          return true;
        }
      }
      return false;
    }

    function applyAssociatedAccompanimentForProgression() {
      var progressionSelect=document.getElementById("progressionSelect");
      var guitarSelect=document.getElementById("guitarPatternSelect");
      var percussionSelect=document.getElementById("rhythmSelect");
      var opt=selectedOptionFor(progressionSelect);
      if(!opt) return;

      var key=optionGroupLabel(opt)+"||"+opt.textContent.trim();
      var pairing=progressionAccompanimentMap[key];
      if(!pairing) return;

      selectOptionByVisibleText(guitarSelect,pairing.guitar);
      selectOptionByVisibleText(percussionSelect,pairing.percussion);

      updateTrigger(guitarSelect);
      updateTrigger(percussionSelect);
    }

      applyAssociatedAccompanimentForProgression();
      render(selectedMajor);
