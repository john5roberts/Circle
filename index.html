      Array.prototype.forEach.call(select.options,function(opt){
        var c=optionCategory(opt);
        if(!seen[c]) { seen[c]=true; cats.push(c); }
      });
      return cats;
    }

    function optionsForBrowserCategory(select, category) {
      return Array.prototype.filter.call(select.options,function(opt){
        return optionCategory(opt) === category;
      });
    }

    function renderBrowserTabs() {
      var host=document.getElementById("choiceTabs");
      host.innerHTML="";
      host.classList.remove("category-grid");
      host.style.removeProperty("--choice-tab-columns");

      var cats=browserCategories(activeBrowserSelect);
      if (activeBrowserSelect) {
        var count = cats.length;
        var columns = count === 10 ? 5 : (count === 8 ? 4 : (count === 6 ? 3 : Math.min(Math.max(count,1),5)));
        host.classList.add("category-grid");
        host.style.setProperty("--choice-tab-columns", String(columns));
      }

      if(!activeBrowserCategory || cats.indexOf(activeBrowserCategory)===-1) {
        activeBrowserCategory=optionCategory(selectedOptionFor(activeBrowserSelect));
        if(cats.indexOf(activeBrowserCategory)===-1) activeBrowserCategory=cats[0];
      }
      cats.forEach(function(cat){
        var b=document.createElement("button");
        b.type="button";
        b.className="choice-tab"+(cat===activeBrowserCategory?" active":"");
        var tabLabel = (activeBrowserSelect && activeBrowserSelect.id === "progressionSelect")
          ? (progressionCategoryDisplay[cat] || cat)
          : cat;
        b.textContent=tabLabel;
        if (tabLabel !== cat) b.title=cat;
        b.addEventListener("click",function(){
          activeBrowserCategory=cat;
          renderBrowserTabs();
          renderBrowserGrid();
        });
        host.appendChild(b);
      });
    }

    function applyBrowserSelection(opt) {
      if(!activeBrowserSelect || !opt) return;

      // Use the exact option index. Several menus intentionally contain
      // duplicate values with different labels, so assigning .value alone
      // can select the wrong duplicate and make multiple tiles appear active.
      var exactIndex = optionIndexInSelect(activeBrowserSelect,opt);
      if (exactIndex < 0) return;
      activeBrowserSelect.selectedIndex = exactIndex;
      updateTrigger(activeBrowserSelect);

      // Reuse each source select's normal change behavior.
      try {
        activeBrowserSelect.dispatchEvent(new Event("change",{bubbles:true}));
      } catch(e) {
        var evt=document.createEvent("Event"); evt.initEvent("change",true,true);
        activeBrowserSelect.dispatchEvent(evt);
      }
      renderBrowserTabs();
      renderBrowserGrid();
    }

    function optionIndexInSelect(select, opt) {
      if (!select || !opt) return -1;
      for (var i=0; i<select.options.length; i++) {
        if (select.options[i] === opt) return i;
      }
      return -1;
    }
function renderBrowserGrid() {
      var host=document.getElementById("choiceGrid");
      host.innerHTML="";
      var opts=optionsForBrowserCategory(activeBrowserSelect,activeBrowserCategory);
      opts.forEach(function(opt){
        var b=document.createElement("button");
        b.type="button";
        var exactIndex = optionIndexInSelect(activeBrowserSelect,opt);
        b.className="choice-item"+(exactIndex===activeBrowserSelect.selectedIndex?" selected":"");
        var nm=document.createElement("div"); nm.className="choice-name"; nm.textContent=opt.textContent.trim();
        var detail=document.createElement("div"); detail.className="choice-detail"; detail.textContent=optionDetail(activeBrowserSelect,opt);
        b.appendChild(nm);
        if(detail.textContent) b.appendChild(detail);
        b.addEventListener("click",function(){ applyBrowserSelection(opt); });
        host.appendChild(b);
      });
    }

    function openChoiceBrowser(selectId) {
      activeBrowserSelect=document.getElementById(selectId);
      if(!activeBrowserSelect) return;
      var cfg=selectorBrowserConfig[selectId];
      document.getElementById("choiceTitle").textContent=cfg.title;
      closeSongBrowserView();
      var songBtn=document.getElementById("choiceSong");
      if(songBtn) songBtn.classList.toggle("visible",selectId==="progressionSelect");
      activeBrowserCategory=optionCategory(selectedOptionFor(activeBrowserSelect));
      browserWasPlaying=progressionPlaying;
      renderBrowserTabs();
      renderBrowserGrid();
      var ov=document.getElementById("choiceOverlay");
      ov.classList.add("open");
      ov.setAttribute("aria-hidden","false");
    }

    function closeChoiceBrowser() {
      closeSongBrowserView();
      var songBtn=document.getElementById("choiceSong");
      if(songBtn) songBtn.classList.remove("visible");
      var ov=document.getElementById("choiceOverlay");
      ov.classList.remove("open");
      ov.setAttribute("aria-hidden","true");
      activeBrowserSelect=null;
      activeBrowserCategory=null;
      if(progressionPlaying && !browserWasPlaying) stopProgressionPlayback();
      browserWasPlaying=false;
    }

    function toggleBrowserPreview() {
      var btn=document.getElementById("choicePreview");
      if(progressionPlaying) {
        stopProgressionPlayback();
        if(btn) btn.textContent="Preview";
      } else {
        startProgressionLoop();
        if(btn) btn.textContent="Stop Preview";
      }
    }

    function initChoiceBrowsers() {
      ["progressionSelect","guitarPatternSelect","bassPatternSelect","rhythmSelect"].forEach(function(id){
        var s=document.getElementById(id);
        if(s && !document.getElementById(id+"Trigger")) makeTrigger(s);
      });

      var doneBtn=document.getElementById("choiceDone");
      var previewBtn=document.getElementById("choicePreview");
      var overlay=document.getElementById("choiceOverlay");

      var songBtn=document.getElementById("choiceSong");
      var modeTitle=document.getElementById("songModeTitle");
      var modeArtist=document.getElementById("songModeArtist");
      var searchInput=document.getElementById("songSearchInput");
      var searchButton=document.getElementById("songSearchButton");

      if(doneBtn) doneBtn.addEventListener("click",closeChoiceBrowser);
      if(previewBtn) previewBtn.addEventListener("click",toggleBrowserPreview);
      if(songBtn) songBtn.addEventListener("click",function(){
        if(songBrowserOpen) closeSongBrowserView(); else openSongBrowser();
      });
      if(modeTitle) modeTitle.addEventListener("click",function(){ setSongSearchMode("title"); });
      if(modeArtist) modeArtist.addEventListener("click",function(){ setSongSearchMode("artist"); });
      if(searchInput) {
        searchInput.addEventListener("input",function(){
          songSearchContains=false;
          renderSongResults();
        });
        searchInput.addEventListener("keydown",function(e){
          if(e.key==="Enter") {
            e.preventDefault();
            songSearchContains=true;
            renderSongResults();
          }
        });
      }
      if(searchButton) searchButton.addEventListener("click",function(){
        songSearchContains=true;
        renderSongResults();
      });
      if(overlay) overlay.addEventListener("click",function(e){
        if(e.target===this) closeChoiceBrowser();
      });

      // Capture the original, richer 4/4 menus before any meter switch.
      if (!fourFourMenuMarkup) {
        fourFourMenuMarkup = {
          rhythm: document.getElementById("rhythmSelect").innerHTML,
          guitar: document.getElementById("guitarPatternSelect").innerHTML,
          bass: document.getElementById("bassPatternSelect").innerHTML
        };
      }

      Array.prototype.forEach.call(document.querySelectorAll(".meter-choice"), function(button){
        button.addEventListener("click", function(){
          setCircleTimeSignature(button.getAttribute("data-signature"));
        });
      });

      // Start with the accompaniment assigned to the default 4/4 progression.
      applyAssociatedAccompanimentForProgression();
    }



    // ---------- Instrument renderer layer ----------
    // The transport decides WHAT happens and WHEN. These functions decide
    // HOW each event is rendered. External sample files can plug in here
    // later without changing the transport or musical pattern logic.

    function renderPercussionEvent(ctx, when, kind) {
      if (playSampledPercussionHit(ctx, when, kind)) return;
      playPercussionHit(ctx, when, kind);
    }

    function renderBassEvent(ctx, midi, duration, when) {
      if (playSampledBassTone(ctx, midi, duration, when)) return;
      playSingleTone(
        ctx, midi, duration, progressionOscillators, when, "bass"
      );
    }

    function renderGuitarChordEvent(ctx, midiNotes, duration, when) {
      for (var n=0; n<midiNotes.length; n++) {
        playSingleTone(
          ctx,
          midiNotes[n],
          duration,
          progressionOscillators,
          when + n * 0.018,
          "chord"
        );
      }
    }

    function renderGuitarArpEvent(ctx, midi, duration, when) {
      playSingleTone(
        ctx, midi, duration, progressionOscillators, when, "arp"
      );
    }

    function scheduleMeterFillHit(ctx, when, beatSeconds, fraction, kind) {
      if (fraction < 0 || fraction >= 1) return;
      scheduleTurnaroundHit(ctx, when, beatSeconds, fraction, kind);
    }

    function scheduleMeterStyleFill(ctx, when, beatSeconds, type, strength) {
      if (!type) return;

      var level =
        strength === "strong" ? 3 :
        strength === "medium" ? 2 : 1;

      function kick(f)    { scheduleMeterFillHit(ctx,when,beatSeconds,f,"kick"); }
      function snare(f)   { scheduleMeterFillHit(ctx,when,beatSeconds,f,"snare"); }
      function hat(f)     { scheduleMeterFillHit(ctx,when,beatSeconds,f,"hat"); }
      function tomHi(f)   { scheduleMeterFillHit(ctx,when,beatSeconds,f,"tomHigh"); }
      function tomLo(f)   { scheduleMeterFillHit(ctx,when,beatSeconds,f,"tomLow"); }
      function rim(f)     { scheduleMeterFillHit(ctx,when,beatSeconds,f,"rim"); }
      function openHat(f) { scheduleMeterFillHit(ctx,when,beatSeconds,f,"openHat"); }
      function ride(f)    { scheduleMeterFillHit(ctx,when,beatSeconds,f,"ride"); }

      switch (type) {
        case "beat3Snare":
        case "beat2Snare":
          if (level >= 1) snare(.75);
          if (level >= 2) snare(.50);
          if (level >= 3) {
            rim(.25);
            snare(.50);
            snare(.75);
          }
          break;

        case "beat3Tom":
        case "compoundTom":
        case "tripletTom":
        case "fullTripletTom":
        case "descendingTom":
          if (level >= 1) tomLo(.75);
          if (level >= 2) {
            tomHi(.50);
            tomLo(.75);
          }
          if (level >= 3) {
            tomHi(.00);
            tomHi(.25);
            tomLo(.50);
            tomLo(.75);
          }
          break;

        case "eighthSnareTom":
        case "fastSnareTom":
        case "compoundSnareTom":
          if (level >= 1) tomLo(.72);
          if (level >= 2) {
            snare(.45);
            tomLo(.78);
          }
          if (level >= 3) {
            tomHi(.18);
            snare(.45);
            tomHi(.68);
            tomLo(.82);
          }
          break;

        case "tripletSnareTom":
          if (level >= 1) tomLo(2/3);
          if (level >= 2) {
            snare(1/3);
            tomLo(2/3);
          }
          if (level >= 3) {
            snare(.00);
            tomHi(1/3);
            tomLo(2/3);
          }
          break;

        case "tripletRideSnare":
          if (level >= 1) ride(2/3);
          if (level >= 2) {
            ride(1/3);
            snare(2/3);
          }
          if (level >= 3) {
            ride(.00);
            ride(1/3);
            snare(2/3);
          }
          break;

        case "broadTom":
          if (level >= 1) tomLo(2/3);
          if (level >= 2) {
            tomHi(1/3);
            tomLo(2/3);
          }
          if (level >= 3) {
            tomHi(.00);
            tomHi(1/3);
            tomLo(2/3);
          }
          break;

        case "snareRoll":
        case "rapidSnare":
        case "accentedRoll":
          if (level >= 1) snare(.75);
          if (level >= 2) {
            snare(.50);
            snare(.75);
          }
          if (level >= 3) {
            snare(.00);
            snare(.25);
            snare(.50);
            snare(.75);
          }
          break;

        case "rollingFill":
          if (level >= 1) tomLo(.75);
          if (level >= 2) {
            snare(.50);
            tomLo(.75);
          }
          if (level >= 3) {
            snare(.00);
            tomHi(.25);
            tomHi(.50);
            tomLo(.75);
          }
          break;

        case "doubleStroke":
          if (level >= 1) {
            rim(.50);
            snare(.75);
          }
          if (level >= 2) kick(.25);
          if (level >= 3) {
            rim(.125);
            snare(.375);
          }
          break;

        case "syncKickSnare":
        case "compoundSync":
          if (level >= 1) snare(.72);
          if (level >= 2) {
            kick(.35);
            snare(.72);
          }
          if (level >= 3) {
            kick(.00);
            rim(.38);
            kick(.65);
            snare(.84);
          }
          break;

        case "syncTom":
        case "kickTomSync":
          if (level >= 1) tomLo(.72);
          if (level >= 2) {
            kick(.35);
            tomHi(.72);
          }
          if (level >= 3) {
            kick(.00);
            tomHi(.38);
            kick(.65);
            tomLo(.84);
          }
          break;

        case "crossRhythm":
        case "crossTom":
          if (level >= 1) rim(2/3);
          if (level >= 2) {
            tomHi(.25);
            rim(.72);
          }
          if (level >= 3) {
            tomHi(.00);
            rim(.42);
            tomLo(.72);
          }
          break;

        case "trainPickup":
          if (level >= 1) openHat(.75);
          if (level >= 2) {
            rim(.50);
            openHat(.75);
          }
          if (level >= 3) {
            hat(.25);
            rim(.50);
            openHat(.75);
          }
          break;

        case "brushSweep":
          if (level >= 1) ride(.75);
          if (level >= 2) {
            ride(.50);
            ride(.75);
          }
          if (level >= 3) {
            ride(.25);
            ride(.50);
            snare(.75);
          }
          break;

        case "restrainedPickup":
          if (level >= 1) rim(.75);
          if (level >= 2) openHat(.83);
          if (level >= 3) {
            rim(.50);
            openHat(.75);
          }
          break;

        case "shortTriplet":
          if (level >= 1) tomLo(2/3);
          if (level >= 2) tomHi(1/3);
          if (level >= 3) {
            snare(.00);
            tomHi(1/3);
            tomLo(2/3);
          }
          break;

        case "openHatPickup":
          if (level >= 1) openHat(.75);
          if (level >= 2) snare(.75);
          if (level >= 3) {
            openHat(.50);
            snare(.75);
          }
          break;

        case "rimTomPickup":
          if (level >= 1) rim(.72);
          if (level >= 2) tomLo(.78);
          if (level >= 3) {
            rim(.35);
            tomHi(.60);
            tomLo(.82);
          }
          break;

        default:
          if (level >= 1) snare(.75);
          if (level >= 2) tomHi(.50);
          if (level >= 3) {
            rim(.25);
            tomLo(.75);
          }
          break;
      }
    }

    function scheduleMeterTurnaroundBeat(ctx, when, beatNumber, beatSeconds) {
      if (harmonyHoldActive) return;
      if (currentTimeSignature === "4/4") return;

      var position = transportProgressionPosition(beatNumber);
      if (!position || position.totalBeats < 2) return;

      var beatsLeft = position.totalBeats - position.beatInPhrase;
      if (beatsLeft !== 1) return;

      var rhythm = selectedMeterRhythm();
      if (!rhythm) return;

      var typeMap = METER_TURNAROUND_TYPES[currentTimeSignature] || {};
      var type = typeMap[rhythm.id];
      if (!type) return;

      // Preserve Circle's established alternation:
      // first phrase ending light, second phrase ending strong.
      var strength = (position.phrasePass % 2 === 0) ? "light" : "strong";
      scheduleMeterStyleFill(ctx, when, beatSeconds, type, strength);
    }

    function selectedMeterRhythmId() {
      var s = document.getElementById("rhythmSelect");
      if (!s) return "";
      return (s.value || "").replace(/^meter:/,"");
    }

    function applyMeterStyleBundle() {
      if (currentTimeSignature === "4/4") return false;

      var rhythmId = selectedMeterRhythmId();
      var bundle = (METER_STYLE_BUNDLES[currentTimeSignature] || {})[rhythmId];
      if (!bundle) return false;

      var guitar = document.getElementById("guitarPatternSelect");
      var bass = document.getElementById("bassPatternSelect");

      var guitarFound = selectOptionByVisibleText(guitar,bundle.guitar);
      var bassFound = selectOptionByVisibleText(bass,bundle.bass);

      updateTrigger(guitar);
      updateTrigger(bass);
      return guitarFound || bassFound;
    }

    var fourFourMenuMarkup = null;
    var meterSelections = {};

    function saveCurrentMeterSelections() {
      var ids = ["rhythmSelect","guitarPatternSelect","bassPatternSelect"];
      var saved = {};
      ids.forEach(function(id){
        var s = document.getElementById(id);
        var opt = selectedOptionFor(s);
        saved[id] = opt ? opt.textContent.trim() : "";
      });
      meterSelections[currentTimeSignature] = saved;
    }

    function buildGroupedOptions(select, items, fallbackGroup, categoryOrder) {
      select.innerHTML = "";
      var groups = {};
      (categoryOrder || []).forEach(function(groupName){
        var g = document.createElement("optgroup");
        g.label = groupName;
        select.appendChild(g);
        groups[groupName] = g;
      });
      items.forEach(function(item){
        var groupName = item.group || fallbackGroup;
        if (!groups[groupName]) {
          var g = document.createElement("optgroup");
          g.label = groupName;
          select.appendChild(g);
          groups[groupName] = g;
        }
        var opt = document.createElement("option");
        opt.value = item.value;
        opt.textContent = item.name;
        groups[groupName].appendChild(opt);
      });
    }

    function buildMeterRhythmOptions(select, signature) {
      var rhythms = METER_RHYTHMS[signature] || [];
      select.innerHTML = "";
      var groups = {};
      var categoryOrder = signature === "3/4" ? ["Basic","Pop","Jazz","Roots"] :
        (signature === "6/8" ? ["Basic","Pop","Funk","Latin","Roots"] :
        (signature === "12/8" ? ["Basic","Pop","Funk","Roots","Latin"] :
        (signature === "2/4" ? ["Basic","Pop","Funk","Latin","Roots"] : [])));
      categoryOrder.forEach(function(groupName){
        var g = document.createElement("optgroup");
        g.label = groupName;
        select.appendChild(g);
        groups[groupName] = g;
      });
      rhythms.forEach(function(rhythm){
        var groupName = rhythm.group || (signature + " Rhythms");
        if (!groups[groupName]) {
          var g = document.createElement("optgroup");
          g.label = groupName;
          select.appendChild(g);
          groups[groupName] = g;
        }
        var opt = document.createElement("option");
        opt.value = "meter:" + rhythm.id;
        opt.textContent = rhythm.name;
        groups[groupName].appendChild(opt);
      });
    }

    function restoreSelectionByLabel(select, label) {
      if (!select || !label) return false;
      for (var i=0;i<select.options.length;i++) {
        if (select.options[i].textContent.trim() === label) {
          select.selectedIndex = i;
          return true;
        }
      }
      return false;
    }

    function populateMeterAccompanimentMenus(signature) {
      var rhythm = document.getElementById("rhythmSelect");
      var guitar = document.getElementById("guitarPatternSelect");
      var bass = document.getElementById("bassPatternSelect");
      if (!rhythm || !guitar || !bass) return;

      if (!fourFourMenuMarkup) {
        fourFourMenuMarkup = {
          rhythm: rhythm.innerHTML,
          guitar: guitar.innerHTML,
          bass: bass.innerHTML
        };
      }

      if (signature === "4/4") {
        rhythm.innerHTML = fourFourMenuMarkup.rhythm;
        guitar.innerHTML = fourFourMenuMarkup.guitar;
        bass.innerHTML = fourFourMenuMarkup.bass;
      } else {
        buildMeterRhythmOptions(rhythm, signature);
        var guitarCategoryOrder = signature === "3/4" ? ["Basic","Arpeggio","Pop","Jazz","Roots"] :
          (signature === "6/8" ? ["Basic","Arpeggio","Pop","Funk","Latin","Roots"] :
          (signature === "12/8" ? ["Basic","Arpeggio","Pop","Funk","Roots","Latin"] :
          (signature === "2/4" ? ["Basic","Arpeggio","Pop","Funk","Latin","Roots"] : null)));
        var bassCategoryOrder = signature === "3/4" ? ["Basic","Movement","Roots"] :
          (signature === "6/8" ? ["Basic","Movement","Roots","Latin"] :
          (signature === "12/8" ? ["Basic","Movement","Roots","Latin"] :
          (signature === "2/4" ? ["Basic","Movement","Latin","Funk"] : null)));
        buildGroupedOptions(guitar, METER_GUITAR_PATTERNS[signature] || [], signature + " Guitar", guitarCategoryOrder);
        buildGroupedOptions(bass, METER_BASS_PATTERNS[signature] || [], signature + " Bass", bassCategoryOrder);
      }

      var saved = meterSelections[signature] || {};
      var rhythmRestored = restoreSelectionByLabel(rhythm, saved.rhythmSelect);
      var guitarRestored = restoreSelectionByLabel(guitar, saved.guitarPatternSelect);
      var bassRestored = restoreSelectionByLabel(bass, saved.bassPatternSelect);

      if (rhythm.selectedIndex < 0 && rhythm.options.length) rhythm.selectedIndex = 0;
      if (guitar.selectedIndex < 0 && guitar.options.length) guitar.selectedIndex = 0;
      if (bass.selectedIndex < 0 && bass.options.length) bass.selectedIndex = 0;

      // On first entry to a non-4/4 meter, let its percussion style choose a
      // coherent Guitar + Bass bundle. If the user has already used the meter,
      // preserve those independent choices instead.
      if (signature !== "4/4" && !guitarRestored && !bassRestored) {
        applyMeterStyleBundle();
      }

      updateTrigger(rhythm);
      updateTrigger(guitar);
      updateTrigger(bass);
    }

    function updateMeterNavIcon(signature) {
      var icon = document.getElementById("meterNavIcon");
      var tab = document.querySelector('.detail-tab[data-panel="meterPanel"]');
      if (!icon) return;
      var parts = String(signature || "4/4").split("/");
      var num = icon.querySelector(".meter-num");
      var den = icon.querySelector(".meter-den");
      if (num) num.textContent = parts[0] || "4";
      if (den) den.textContent = parts[1] || "4";
      if (tab) {
        tab.setAttribute("aria-label", "Meter: " + signature);
        tab.setAttribute("title", "Meter: " + signature);
      }
    }

    function setCircleTimeSignature(signature) {
      if (!TIME_SIGNATURES[signature] || signature === currentTimeSignature) return;
      discardWorkingProgressionDraft();
      stopChordAudition(true);
      if (progressionPlaying) stopProgressionPlayback();

      saveCurrentMeterSelections();
      currentTimeSignature = signature;
      updateMeterNavIcon(signature);

      Array.prototype.forEach.call(document.querySelectorAll(".meter-choice"), function(button){
        button.classList.toggle("selected", button.getAttribute("data-signature") === signature);
      });

      populateMeterAccompanimentMenus(signature);

      transportVisualStateKey = "";
      render(selectedMajor);
      renderProgressionStrip(null, null, false);
    }

    function selectedMeterRhythm() {
      if (currentTimeSignature === "4/4") return null;
      var select = document.getElementById("rhythmSelect");
      if (!select) return null;
      var id = (select.value || "").replace(/^meter:/,"");
      var list = METER_RHYTHMS[currentTimeSignature] || [];
      for (var i=0;i<list.length;i++) if (list[i].id === id) return list[i];
      return list.length ? list[0] : null;
    }

    function scheduleMeterRhythmSteps(ctx, when, beatSeconds, beatInMeasure, rhythm, steps, kind) {
      if (!steps || !steps.length || !rhythm) return;
      var stepsPerPulse = rhythm.subdivisions * (currentMeter().compound ? 3 : 1);
      var stepDuration = beatSeconds / stepsPerPulse;

      for (var i=0;i<steps.length;i++) {
        var step = steps[i];
        var eventPulse = Math.floor(step / stepsPerPulse);
        if (eventPulse !== beatInMeasure) continue;
        var localStep = step % stepsPerPulse;
        renderPercussionEvent(ctx, when + localStep * stepDuration, kind);
      }
    }

    function getTransportBeatSeconds() {
      var tempo = document.getElementById("tempoSelect");
      var bpm = tempo ? parseFloat(tempo.value) : 100;
      if (!isFinite(bpm) || bpm <= 0) bpm = 100;
      return 60 / bpm;
    }

    function scheduleTransportMetronomeBeat(ctx, when, beatNumber) {
      var toggle = document.getElementById("metronomeToggle");
      if (!toggle || !toggle.checked) return;
      playMetronomeClick(ctx, when, (beatNumber % meterPulsesPerMeasure()) === 0);
    }

    function selectedPercussionFamily() {
      var select = document.getElementById("rhythmSelect");
      if (!select || select.selectedIndex < 0) return "Basic";
      var opt = select.options[select.selectedIndex];
      var parent = opt ? opt.parentElement : null;
      var label = (parent && parent.tagName === "OPTGROUP") ? parent.label : "Basic";
      // Keep playback behavior independent from user-facing taxonomy names.
      var aliases = {
        "Straight / Basic":"Basic",
        "Pop / Rock":"Pop",
        "Brazilian / Latin":"Latin",
        "Jazz / Swing":"Jazz",
        "Funk / Soul / R&B":"Funk",
        "Folk / Country":"Roots",
        "Reggae / Other":"Reggae"
      };
      return aliases[label] || label;
    }

    function baseProgressionPosition(progressionBeatNumber) {

            beatInChord:beatInPhrase-cursor,
            beatsForChord:counts[j],
            beatInPhrase:beatInPhrase,
            phrasePass:Math.floor(progressionBeatNumber/totalBeats),
            totalBeats:totalBeats,

        var beatInChord = (h.anchorBeatInChord + elapsed) % h.beatsForChord;
        return {
          chordIndex:h.chordIndex,
          degree:h.degree,
          beatInChord:beatInChord,
          beatsForChord:h.beatsForChord,
          beatInPhrase:h.chordBeatInPhrase + beatInChord,
          phrasePass:h.phrasePass,
          totalBeats:h.totalBeats,
          progressionBeat:h.chordStartProgressionBeat + beatInChord,

    function scheduleTransportBassBeat(ctx, when, beatNumber, beatSeconds) {

      if (!position) return;

      var events = selectedBassPatternEvents();
      if (!events.length) return;

      var info = progressionChordInfo(getSelectedProgression(), position.chordIndex);

          if (Math.floor(pos + 1e-9) !== position.beatInChord) continue;

          var noteWhen = when + fraction * beatSeconds;
          var remaining = (position.beatsForChord - pos) * beatSeconds;

            0.07,
            Math.min(beatSeconds * 0.72, remaining - 0.025)

            bassMidiForKind(info, events[i].kind),
            bassDur,
            noteWhen

    function scheduleTransportGuitarBeat(ctx, when, beatNumber, beatSeconds) {

"Chromatic||Minor blues":{"guitar":"Soul pocket","percussion":"R&B pocket","bass":"Soul pocket"},
"Chromatic||Jazz blues":{"guitar":"Shell comp feel","percussion":"Four to the bar","bass":"Walking chord tones"},
"Chromatic||Bird blues":{"guitar":"Jazz chord pocket","percussion":"Swing sparse","bass":"Walking chord tones"},
"Chromatic||8-bar blues":{"guitar":"Jazz ballad","percussion":"Two feel","bass":"Jazz two-feel"}};

    function optionGroupLabel(opt) {
      return opt && opt.parentElement && opt.parentElement.tagName === "OPTGROUP"
        ? opt.parentElement.label : "Other";
    }

    function selectOptionByVisibleText(select, textValue) {
      if(!select) return false;
      for(var i=0;i<select.options.length;i++) {
        if(select.options[i].textContent.trim() === textValue) {
          select.selectedIndex=i;
          return true;
        }
      }
      return false;
    }

    function associatedBassPatternFor(percussionName) {
      var s=(percussionName || "").toLowerCase();
      if (s.indexOf("bossa") !== -1) return "Bossa basic";
      if (s.indexOf("samba") !== -1) return "Samba pulse";
      if (s.indexOf("tresillo") !== -1 || s.indexOf("latin") !== -1 || s.indexOf("tango") !== -1) return "Latin tresillo";

      if (s.indexOf("swing") !== -1 || s.indexOf("charleston") !== -1 || s.indexOf("four to the bar") !== -1) return "Walking chord tones";
      if (s.indexOf("jazz ballad") !== -1 || s.indexOf("two feel") !== -1) return "Jazz two-feel";

      if (s.indexOf("funk") !== -1) return "Funk syncopated";
      if (s.indexOf("motown") !== -1) return "Motown movement";
      if (s.indexOf("neo-soul") !== -1) return "Neo-soul sparse";
      if (s.indexOf("soul") !== -1 || s.indexOf("r&b") !== -1) return "Soul pocket";

      if (s.indexOf("country") !== -1 || s.indexOf("train") !== -1) return "Country boom-chuck";
      if (s.indexOf("folk") !== -1) return "Folk two-feel";
      if (s.indexOf("reggae") !== -1) return "Reggae sparse";

      if (s.indexOf("eighth") !== -1 || s.indexOf("driving") !== -1 || s.indexOf("rock") !== -1) return "Alternating root–fifth";
      return "Two-feel roots";
    }

    // v1.57+: Progression is the accompaniment style leader in every meter.
    // Assignments are distributed through the available guitar/percussion/bass
    // libraries before repeating. Musical matches are preferred when possible,
    // but coverage of the available palette is the primary automation goal.
    var progressionStyleCursor = {};

    function availableSelectNames(select) {
      if(!select) return [];
      return Array.prototype.map.call(select.options, function(o){ return o.textContent.trim(); });
    }

    function styleKeywordsForProgression(text) {
      var t=(text||"").toLowerCase();
      if(/blues/.test(t)) return ["blues","shuffle","swing","jazz","soul"];
      if(/bossa|latin|phrygian|tango/.test(t)) return ["bossa","latin","tango"];
      if(/jazz|ii|v|cadence|secondary/.test(t)) return ["jazz","swing","charleston"];
      if(/minor|dorian|soul|r&b/.test(t)) return ["soul","funk","neo","r&b"];
      if(/rock|mixolydian|anthem|power/.test(t)) return ["rock","driving","power"];
      if(/pop/.test(t)) return ["pop","ballad"];
      return ["folk","two","straight"];
    }

    function chooseDistributedStyle(select, preferred, meter) {
      var options=availableSelectNames(select);
      if(!options.length) return null;
      var pool=options.filter(function(n){ return preferred.some(function(k){return n.toLowerCase().indexOf(k)!==-1;}); });
      if(!pool.length) pool=options;
      var key=meter+"|"+(select.id||"style");
      var i=progressionStyleCursor[key]||0;
      var choice=pool[i % pool.length];
      progressionStyleCursor[key]=i+1;
      return choice;
    }

    function getProgressionStyleAssignment(key, meter, phraseText) {
      var explicit=progressionAccompanimentMap[key];
      var prefs=styleKeywordsForProgression((phraseText||"")+" "+(key||""));
      var guitar=explicit && explicit.guitar;
      var percussion=explicit && explicit.percussion;
      var bass=explicit && explicit.bass;

      // Blues gets deliberate meter-specific defaults so the longer forms
      // retain an idiomatic feel outside 4/4 as well.
      var isBlues = /blues/i.test(phraseText || "");
      if (isBlues && meter !== "4/4") {
        var meterBlues = {
          "3/4":  {guitar:"Jazz waltz offbeats", percussion:"Jazz waltz", bass:"Waltz chord-tone walk"},
          "6/8":  {guitar:"6/8 blues comp", percussion:"6/8 blues", bass:"6/8 blues walk"},
          "12/8": {guitar:"12/8 blues comp", percussion:"12/8 blues", bass:"12/8 chord-tone walk"},
          "2/4":  {guitar:"Country boom-chuck", percussion:"Train beat", bass:"Country pickup bass"}
        }[meter];
        if (meterBlues) {
          guitar = meterBlues.guitar;
          percussion = meterBlues.percussion;
          bass = meterBlues.bass;
        }
      }

      // Retain logical historical choices where they exist, but repair obsolete
      // names by falling through to the distributed library selection.
      var guitarSelect=document.getElementById("guitarPatternSelect");
      var percussionSelect=document.getElementById("rhythmSelect");
      var bassSelect=document.getElementById("bassPatternSelect");
      if(!guitar || !availableSelectNames(guitarSelect).includes(guitar))
        guitar=chooseDistributedStyle(guitarSelect,prefs,meter);
      if(!percussion || !availableSelectNames(percussionSelect).includes(percussion))
        percussion=chooseDistributedStyle(percussionSelect,prefs,meter);

      if(!bass) bass=associatedBassPatternFor(percussion);
      if(!availableSelectNames(bassSelect).includes(bass))
        bass=chooseDistributedStyle(bassSelect,prefs,meter);
      return {guitar:guitar, percussion:percussion, bass:bass};
    }

    function applyAssociatedAccompanimentForProgression() {
      var progressionSelect=document.getElementById("progressionSelect");
      var guitarSelect=document.getElementById("guitarPatternSelect");
      var bassSelect=document.getElementById("bassPatternSelect");
      var percussionSelect=document.getElementById("rhythmSelect");
      var opt=selectedOptionFor(progressionSelect);
      if(!opt) return;

      var key=optionGroupLabel(opt)+"||"+opt.textContent.trim();
      var assignment=getProgressionStyleAssignment(key,currentTimeSignature,opt.textContent.trim());
      if(!assignment) return;

      selectOptionByVisibleText(guitarSelect,assignment.guitar);
      selectOptionByVisibleText(percussionSelect,assignment.percussion);
      selectOptionByVisibleText(bassSelect,assignment.bass);

      updateTrigger(guitarSelect);
      updateTrigger(bassSelect);
      updateTrigger(percussionSelect);
    }

    document.getElementById("playProgressionBtn").addEventListener("click", function(){
      closeDetailPanels();
      if (progressionPlaying) stopProgressionPlayback(); else startProgressionLoop();
    });
    Array.prototype.forEach.call(document.querySelectorAll(".detail-tab"), function(tab){
      tab.addEventListener("click", function(){
        toggleDetailPanel(tab.getAttribute("data-panel"));
      });
    });
    ["bassToggle","chordToggle","percussionToggle","metronomeToggle"].forEach(function(id){
      var input = document.getElementById(id);
      if (!input) return;
      input.addEventListener("change", syncMixButtonStates);
    });
    ["bassFader","chordsFader","drumsFader","clickFader"].forEach(function(id){
      var fader = document.getElementById(id);
      if (!fader) return;
      fader.addEventListener("input", applyMixerLevels);
      fader.addEventListener("change", applyMixerLevels);
    });
    document.getElementById("progressionSelect").addEventListener("change", function(){
      clearActiveSong();
      discardWorkingProgressionDraft();
      stopChordAudition(true);
      if (progressionPlaying) stopProgressionPlayback();
      applyAssociatedAccompanimentForProgression();
      render(selectedMajor);
      renderProgressionStrip(null, null, false);
      updateTrigger(this);
    });
    document.getElementById("guitarPatternSelect").addEventListener("change", function(){
      stopChordAudition(true);
      if (progressionPlaying) stopProgressionPlayback();
      updateTrigger(this);
    });
    document.getElementById("bassPatternSelect").addEventListener("change", function(){
      stopChordAudition(true);
      if (progressionPlaying) stopProgressionPlayback();
      updateTrigger(this);
    });
    document.getElementById("rhythmSelect").addEventListener("change", function(){
      stopChordAudition(true);
      if (progressionPlaying) stopProgressionPlayback();

      if (currentTimeSignature !== "4/4") {
        applyMeterStyleBundle();
      }

      updateTrigger(this);
    });
function primeAudioSamples(){
      ensureAudioReady(function(ctx){
        loadPercussionSamples(ctx);
        loadBassSamples(ctx);
        if (selectedInstrument() === "sampled") {
          loadGuitarSamples(ctx);
        }
      });
    }


    document.addEventListener("touchstart", function bootAudio(){
      primeAudioSamples();
      document.removeEventListener("touchstart", bootAudio);
    }, { once: true });
    document.addEventListener("mousedown", function bootAudioMouse(){
      primeAudioSamples();
      document.removeEventListener("mousedown", bootAudioMouse);
    }, { once: true });

    selectedSpellingPreference = "conventional";
    setTransportButtonState("play");
    syncMixButtonStates();
    applyMixerLevels();
    updateMeterNavIcon(currentTimeSignature);
    closeDetailPanels();
    render("C");
    renderProgressionStrip(null, null, false);

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", function(){
        initChoiceBrowsers();
      }, { once:true });
    } else {
      initChoiceBrowsers();
    }
</script>

  <div id="choiceOverlay" class="choice-overlay" aria-hidden="true">
    <div class="choice-sheet" role="dialog" aria-modal="true" aria-labelledby="choiceTitle">
      <div class="choice-head">
        <div id="choiceTitle" class="choice-title">Choose</div>
        <div class="choice-head-actions">
          <button type="button" id="choiceSong" class="choice-song">Song</button>
          <button type="button" id="choicePreview" class="choice-preview">Preview</button>
          <button type="button" id="choiceDone" class="choice-done">Done</button>
        </div>
      </div>
      <div id="choiceTabs" class="choice-tabs"></div>
      <div id="choiceGrid" class="choice-grid"></div>
      <div id="songBrowser" class="song-browser" aria-hidden="true">
        <div class="song-search-tools">
          <div class="song-search-mode">
            <button type="button" id="songModeTitle" class="song-mode-btn active">Title</button>
            <button type="button" id="songModeArtist" class="song-mode-btn">Artist</button>
          </div>
          <input id="songSearchInput" class="song-search-input" type="search"
                 autocomplete="off" autocapitalize="none" spellcheck="false"
                 placeholder="Start typing…" aria-label="Search songs">
          <button type="button" id="songSearchButton" class="song-search-btn">Search</button>
        </div>
        <div id="songLibraryStatus" class="song-library-status"></div>
        <div id="songResults" class="song-results"></div>
      </div>
    </div>
  </div>

</body>
