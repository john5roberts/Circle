<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Circle v1.111</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    .wrap { min-height: 100vh; padding: 8px; }
    .panel {
      width: min(100vw - 16px, 460px);
      margin: 0 auto;
      background: rgba(255,255,255,0.9);
      border-radius: 22px;
      padding: 8px;
    }
    svg { width: 100%; height: auto; display: block; }
    .label { pointer-events: none; user-select: none; }
    .clickable { cursor: pointer; }
    .active-wedge {
      filter:brightness(1.45) drop-shadow(0 0 7px rgba(255,255,255,.55));
    }
    .controls { display: flex; gap: 8px; align-items: center; margin: 10px 4px 0 4px; }
    .top-arrangement {
      margin: 10px 4px 0 4px;
      display: grid;
      grid-template-columns: minmax(0,1fr) 132px;
      gap: 8px;
      align-items: start;
    }

    .progression-stack, .play-stack {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .top-arrangement .controls {
      margin: 0;
    }

    .top-arrangement .mix-row,
    .top-arrangement .tempo-row,
    .top-arrangement .meter-row {
      margin: 0;
    }

    .play-stack #playProgressionBtn {
      width: 100%;
      min-width: 0;
      min-height: 48px;
      border-radius: 10px;
      background: #202428 !important;
      color: #f2f4f5 !important;
      border: 1px solid #4a5056 !important;
      font: inherit;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
    }

    .play-stack .tempo-row {
      display: block;
    }

    .play-stack #tempoSelect {
      width: 100% !important;
      height: 48px !important;
      border-radius: 10px;
      padding: 8px 10px;
      font-size: 15px;
    }

    .progression-stack .mix-row {
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 5px;
    }

    .progression-stack .mix-row label {
      min-height: 36px;
      padding: 6px 4px;
      font-size: 11px;
    }
.controls + .controls { margin-top: 8px; }
    .controls select, .controls button {
      font: inherit; font-size: 16px; border-radius: 10px; border: 1px solid #cbd5e1;
      background: white; padding: 10px 12px;
    }
    .controls select { flex: 1; min-width: 0; }
    .controls button { min-width: 78px; font-weight: 700; cursor: pointer; }
    .controls label {
      display: inline-flex; align-items: center; gap: 6px; font-size: 15px;
      background: white; border: 1px solid #cbd5e1; border-radius: 10px; padding: 10px 12px;
      color: #111827;
    }

    :root {
      --board:#111315;
      --panel:#181b1e;
      --panel2:#202428;
      --line:#454b51;
      --text:#f2f4f5;
      --muted:#9aa1a7;
      --green:#27c96f;
      --greenDark:#153d29;
      --red:#ef4b4b;
      --redDark:#492020;
    }
    body {
      background:#0b0d0e !important;
      color:var(--text);
    }
    .wrap { padding:8px; background:#0b0d0e; }
    .panel {
      background:var(--board) !important;
      border:1px solid #30353a;
      box-shadow:0 10px 28px rgba(0,0,0,.38);
      color:var(--text);
    }
    #wheel { background:var(--board); border-radius:18px; }
    .controls select, .controls button, .controls label {
      background:var(--panel2) !important;
      color:var(--text) !important;
      border:1px solid var(--line) !important;
    }
    .controls select { color-scheme:dark; }
    .controls button { font-weight:800; }
    #playProgressionBtn {
      border-color:#737b82 !important;
    }
    #playProgressionBtn.playing {
      background:#e6e8ea !important;
      color:#111315 !important;
      border-color:#f5f6f7 !important;
      box-shadow:inset 0 0 0 1px #ffffff;
    }
    .controls label:has(input:checked) {
      background:#e6e8ea !important;
      border-color:#f5f6f7 !important;
      box-shadow:inset 0 0 0 1px #ffffff;
      color:#111315 !important;
    }
    input[type="checkbox"] { accent-color:#d8dcdf; }

    .progression-strip-shell {
      position:relative;
      margin:8px 4px 2px 4px;
      min-height:54px;
    }
    .progression-strip {
      display:flex;
      align-items:stretch;
      gap:5px;
      margin:0;
      min-height:54px;
      position:relative;
      overflow:visible;
    }
    /* Long progressions keep the current four-across button size and scroll
       horizontally. Extra vertical room lives above the buttons so the
       long-press beat editor can still open without being clipped. */
    .progression-strip.long-strip {
      height:96px;
      min-height:96px;
      margin-top:-42px;
      padding-top:42px;
      box-sizing:border-box;
      overflow-x:auto;
      overflow-y:hidden;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      touch-action:pan-x;
      overscroll-behavior-x:contain;
    }
    .progression-strip.long-strip::-webkit-scrollbar { display:none; }
    .progression-strip.long-strip .prog-chip {
      flex:0 0 calc((100% - 15px) / 4);
      min-width:0;
    }
    .progression-playhead {
      display:none;
      position:absolute;
      left:37.5%;
      top:0;
      width:34px;
      height:3px;
      border-radius:999px;
      transform:translateX(-50%);
      background:#f2f4f5;
      box-shadow:0 0 6px rgba(242,244,245,.7);
      pointer-events:none;
      z-index:70;
    }
    .progression-strip-shell.following .progression-playhead { display:block; }
    .prog-chip {
      flex:1 1 0;
      min-width:0;
      border-radius:9px;
      border:1px solid #3d4348;
      background:#202428;
      color:#d8dcdf;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:7px 3px;
      font-size:16px;
      font-weight:800;
      line-height:1;
      flex-direction:column;
      gap:5px;
      transition:filter .08s, box-shadow .08s, transform .08s;
      position:relative;
      -webkit-touch-callout:none;
      -webkit-user-select:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
      touch-action:manipulation;
    }
    .prog-chip *,
    .beat-editor,
    .beat-editor * {
      -webkit-touch-callout:none;
      -webkit-user-select:none;
      user-select:none;
      -webkit-tap-highlight-color:transparent;
    }
    .beat-editor {
      position:absolute;
      left:50%;
      bottom:calc(100% + 7px);
      transform:translateX(-50%);
      width:108px;
      height:34px;
      display:grid;
      grid-template-columns:34px 40px 34px;
      align-items:stretch;
      border:1px solid #596168;
      border-radius:9px;
      background:#171a1d;
      box-shadow:0 4px 14px rgba(0,0,0,.42);
      overflow:hidden;
      z-index:60;
    }
    .prog-chip:first-child .beat-editor { left:0; transform:none; }
    .prog-chip:last-child .beat-editor { left:auto; right:0; transform:none; }
    .prog-chip:only-child .beat-editor { left:50%; right:auto; transform:translateX(-50%); }
    .beat-editor button {
      appearance:none;
      -webkit-appearance:none;
      border:0;
      border-right:1px solid #3d4348;
      border-radius:0;
      background:#202428;
      color:#d8dcdf;
      font:800 18px/1 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      padding:0;
      margin:0;
      min-width:0;
      touch-action:manipulation;
    }
    .beat-editor button:last-child { border-right:0; }
    .beat-editor .beat-count {
      font-size:15px;
      background:#2a2f34;
      color:#f0f2f3;
    }
    .beat-editor button:active { filter:brightness(1.35); }
    /* Progression strip: all inactive chords stay neutral.
       Green/red is reserved for the chord that is sounding now. */
    .prog-chip.in-key,
    .prog-chip.out-key {
      color:#b7bdc2;
      border-color:#3d4348;
      background:#202428;
    }
    .prog-chip .alteration {
      font-size:11px; font-weight:700; line-height:1; opacity:.78; white-space:nowrap;
    }
    .prog-chip.active.in-key {
      color:var(--green);
      border-color:#2b7d50;
      background:#14251c;
    }
    .prog-chip.active.out-key {
      color:var(--red);
      border-color:#8d3939;
      background:#291818;
    }
    .prog-chip.active {
      filter:brightness(1.35);
      box-shadow:0 0 0 2px currentColor, 0 0 8px currentColor;
      transform:translateY(-1px);
    }
    .prog-chip.hold-target { cursor:pointer; touch-action:manipulation; }
    .prog-chip.view-toggle { cursor:pointer; touch-action:manipulation; }
    .progression-strip.blank-view { touch-action:manipulation; }
    .progression-back-button {
      flex:0 0 54px;
      width:54px;
      height:54px;
      aspect-ratio:1;
      border-radius:9px;
      border:1px solid #3d4348;
      background:#202428;
      color:#d8dcdf;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:0;
      font-size:24px;
      font-weight:700;
      line-height:1;
      cursor:pointer;
      touch-action:manipulation;
      transition:filter .08s, box-shadow .08s, transform .08s;
    }
    .progression-back-button:active {
      filter:brightness(1.25);
      transform:translateY(1px);
    }
    .active-wedge {
      filter:brightness(1.5) drop-shadow(0 0 8px currentColor) !important;
    }


    .source-select {
      position:absolute !important;
      width:1px !important;
      height:1px !important;
      opacity:0 !important;
      pointer-events:none !important;
      overflow:hidden !important;
    }
    .browser-trigger {
      flex:1;
      min-width:0;
      min-height:48px;
      text-align:left;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:3px;
      padding:8px 12px !important;
      background:#202428 !important;
      border:1px solid #4a5056 !important;
      color:#f2f4f5 !important;
      border-radius:10px;
      cursor:pointer;
    }
    .browser-trigger .trigger-label {
      font-size:10px;
      letter-spacing:.08em;
      color:#9aa1a7;
      font-weight:800;
      text-transform:uppercase;
      line-height:1;
    }
    .browser-trigger .trigger-value {
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:0;
      font-size:15px;
      font-weight:800;
      line-height:1.15;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    .browser-trigger .trigger-value .main-value {
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .choice-overlay {
      position:fixed;
      inset:0;
      z-index:5000;
      background:transparent;
      display:none;
      align-items:flex-end;
      justify-content:center;
      padding:10px;
    }
    .choice-overlay.open { display:flex; }
    .choice-sheet {
      width:min(100%,520px);
      height:440px;
      min-height:440px;
      max-height:440px;
      position:relative;
      /* v1.71: true transparent glass.  Apply the blur directly to the
         dialog instead of a pseudo-element/isolated stacking context so
         Safari and embedded WebViews composite the live app behind it. */
      background:rgba(14,17,19,.08) !important;
      -webkit-backdrop-filter:blur(14px) saturate(115%);
      backdrop-filter:blur(14px) saturate(115%);
      border:1px solid rgba(120,128,136,.72);
      border-radius:18px;
      box-shadow:0 16px 42px rgba(0,0,0,.34);
      display:flex;
      flex-direction:column;
      overflow:hidden;
    }
    .choice-head {
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:0;
      padding:13px 14px 10px;
      border-bottom:1px solid rgba(80,88,95,.55);
    }
    .choice-title {
      font-size:17px;
      font-weight:900;
      color:#f2f4f5;
      min-width:0;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }
    .choice-head-actions {
      display:flex;
      align-items:center;
      gap:8px;
      flex:0 0 auto;
      margin-left:auto;
      padding-left:14px;
    }
    .choice-head-actions button {
      border:1px solid #565d63;
      background:#202428;
      color:#f2f4f5;
      border-radius:9px;
      padding:7px 11px;
      font:inherit;
      font-weight:850;
      white-space:nowrap;
      opacity:1;
    }
    .choice-head-actions .choice-done {
      background:#e6e8ea;
      color:#111315;
      border-color:#fff;
    }
    .choice-tabs {
      display:flex;
      gap:7px;
      overflow-x:auto;
      padding:10px 12px;
      border-bottom:1px solid rgba(80,88,95,.55);
      scrollbar-width:none;
    }
    .choice-tabs::-webkit-scrollbar { display:none; }
    .choice-tabs.category-grid {
      display:grid;
      grid-template-columns:repeat(var(--choice-tab-columns),minmax(0,1fr));
      gap:7px;
      overflow-x:visible;
    }
    .choice-tabs.category-grid .choice-tab {
      width:100%;
      min-width:0;
      padding-left:4px;
      padding-right:4px;
      text-align:center;
    }

    /* v1.80: Every chooser uses the same fixed outer height, doubled to match the requested popup footprint.  The choice
       viewport consumes whatever space remains below the header/tabs and
       scrolls internally when its choices exceed that space. */
.choice-tab {
      flex:0 0 auto;
      border:1px solid #4b5258;
      background:#1b1f22;
      color:#c6cbd0;
      border-radius:999px;
      padding:8px 11px;
      font:inherit;
      font-size:12px;
      font-weight:800;
      white-space:nowrap;
    }
    .choice-tab.active {
      background:#e6e8ea;
      color:#111315;
      border-color:#fff;
    }
    .choice-grid {
      overflow-y:auto;
      -webkit-overflow-scrolling:touch;
      padding:12px;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      grid-auto-rows:62px;
      align-content:start;
      gap:9px;
      flex:1 1 auto;
      min-height:0;
      overscroll-behavior:contain;
    }
    /* Popup interior remains transparent; interactive controls stay solid. */
    .choice-head,
    .choice-tabs,
    .choice-grid {
      background:transparent;
    }
    .choice-tab,
    .choice-item,
    .choice-head-actions button {
      opacity:1;
    }

    .choice-item {
      box-sizing:border-box;
      height:62px;
      min-height:62px;
      max-height:62px;
      border:1px solid #454b51;
      background:#1b1f22;
      color:#f2f4f5;
      border-radius:11px;
      padding:9px 8px;
      font:inherit;
      text-align:center;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:5px;
      cursor:pointer;
    }
    .choice-item.selected {
      border-color:#fff;
      box-shadow:inset 0 0 0 1px #fff;
      background:#2b3034;
    }
    .choice-item .choice-name {
      font-size:13px;
      line-height:1.15;
      font-weight:850;
    }
    .choice-item .choice-detail {
      font-size:10px;
      line-height:1.1;
      color:#aeb4b9;
      font-weight:700;
    }

    @media (max-width:380px) {
      .choice-grid { grid-template-columns:1fr; }
    }
/* v1.38 compact control layout */
    .section-heading {
      margin: 13px 5px 3px;
      font-size: 10px;
      line-height: 1;
      letter-spacing: .11em;
      text-transform: uppercase;
      font-weight: 850;
      color: #8f979e;
    }
    .tempo-row {
      margin: 8px 4px 0;
      display: grid;
      grid-template-columns: 74px minmax(0,1fr);
      gap: 8px;
      align-items: center;
    }

    .row-heading {
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
      font-weight: 850;
      color: #9aa1a7;
      padding-left: 2px;
    }
    .tempo-row #tempoSelect {
      position: static !important;
      width: 100% !important;
      height: 36px !important;
      opacity: 1 !important;
      pointer-events: auto !important;
      overflow: visible !important;
      min-width: 0;
      border-radius: 8px;
      padding: 5px 10px;
      font: inherit;
      font-size: 14px;
      background: #202428 !important;
      color: #f2f4f5 !important;
      border: 1px solid #4a5056 !important;
      color-scheme: dark;
    }
.accompaniment-control {
      margin-top: 5px !important;
    }

    .accompaniment-control .browser-trigger {
      min-height: 40px;
      padding: 6px 10px !important;
      flex-direction: row;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      border-radius: 8px;
    }

    .accompaniment-control .trigger-label {
      order: 2;
      flex: 0 0 82px;
      font-size: 9.5px;
      line-height: 1;
      text-align: right;
    }

    .accompaniment-control .trigger-value {
      order: 1;
      flex: 1 1 auto;
      min-width: 0;
      font-size: 14px;
      line-height: 1.1;
      text-align: right;
      justify-content: flex-end;
    }
.mix-row {
      margin: 5px 4px 0;
      display: grid;
      grid-template-columns: repeat(4, minmax(0,1fr));
      gap: 5px;
    }

    .mix-row label {
      min-width: 0;
      min-height: 36px;
      padding: 6px 5px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      background: #202428;
      border: 1px solid #4a5056;
      color: #f2f4f5;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
    }

    .mix-row input[type="checkbox"] {
      margin: 0;
      width: 14px;
      height: 14px;
      accent-color: #d8dcdf;
    }

    .tempo-row {
      margin-top: 6px;
      margin-bottom: 3px;
    }

    @media (max-width: 390px) {
      .mix-row label {
        font-size: 11px;
        gap: 3px;
        padding-left: 3px;
        padding-right: 3px;
      }
      .accompaniment-control .trigger-label {
        flex-basis: 76px;
      }
      .tempo-row {
        grid-template-columns: 68px minmax(0,1fr);
      }
    }

  
    /* Upcoming-chord cue. Current chord stays steady. */
    .prog-chip.next-cue {
      box-shadow:
        0 0 0 2px rgba(242,244,245,.95) inset,
        0 0 0 1px rgba(242,244,245,.35);
      filter: brightness(1.22);
    }

  
    /* Next-chord cue on the circle of fifths. */
    .next-cue-wedge {
      filter: brightness(1.18);
    }

  
    /* Root–third–fifth interval display under each Roman numeral. */
    .triad-intervals {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:4px;
      min-height:12px;
      font-size:11px;
      font-weight:800;
      line-height:1;
      letter-spacing:0;
      white-space:nowrap;
    }

    .triad-interval {
      display:inline-block;
      min-width:10px;
      text-align:center;
    }

    .triad-interval.diatonic {
      color:#65e69b;
    }

    .triad-interval.nondiatonic {
      color:#ff7777;
    }

    .triad-interval-space {
      display:none;
    }

    .prog-chip.active .triad-interval,
    .prog-chip.next-cue .triad-interval {
      filter:none;
    }

    /* Transport controls */
    .play-stack #playProgressionBtn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-width: 0;
      min-height: 48px;
      padding: 0 !important;
      border-radius: 10px;
      background: #000 !important;
      color: #fff !important;
      border: 1px solid #4a5056 !important;
      cursor: pointer;
    }

    .play-stack #playProgressionBtn:disabled {
      opacity: .72;
      cursor: default;
    }

    .transport-icon {
      display: block;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .transport-icon.play-icon {
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      border-left: 17px solid #fff;
      margin-left: 3px;
    }

    .transport-icon.stop-icon {
      width: 17px;
      height: 17px;
      background: #fff;
    }

    .progression-stack .mix-row label {
      position: relative;
      min-height: 36px;
      padding: 6px 4px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #202428;
      border: 1.5px solid #6a7076;
      color: #f2f4f5;
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      transition: border-color 140ms ease, background 140ms ease, opacity 140ms ease;
    }

    .progression-stack .mix-row label.mix-active {
      color: #f2f4f5;
      border-color: #d5d9dc;
      background: #30353a;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.16);
    }

    .progression-stack .mix-row label:not(.mix-active) {
      border-color: #6a7076;
      background: #202428;
      box-shadow: none;
    }

    .progression-stack .mix-row input[type="checkbox"] {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      overflow: hidden !important;
      clip: rect(0 0 0 0) !important;
      clip-path: inset(50%) !important;
      white-space: nowrap !important;
      border: 0 !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .progression-stack .mix-row label:focus-within {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

  
    /* Mixer columns align exactly with Bass/Chords/Drums/Click. */

    /* v1.90 design-system polish: one visual grammar, no behavioral changes. */
    :root {

      --radius-control: 8px;

      --surface: #202428;
      --surface-raised: #24292d;
      --surface-selected: #30353a;
      --border: #454b51;
      --border-strong: #d5d9dc;
      --text-primary: #f2f4f5;
      --text-secondary: #9aa1a7;
      --text-tertiary: #858d94;
      --ui-fast: 150ms;
      --ui-ease: cubic-bezier(.2,.7,.2,1);
    }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;

    body,
    button,
    select,
    input {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;
    }

    /* Primary control surfaces share one restrained depth treatment. */
    .browser-trigger,
    .progression-stack .mix-row label,
    .meter-panel .meter-choice,
    .choice-tab,
    .choice-item,
    .choice-head-actions button,
    .play-stack #playProgressionBtn,

      box-shadow: inset 0 1px 0 rgba(255,255,255,.035);
      transition:
        background-color var(--ui-fast) var(--ui-ease),
        border-color var(--ui-fast) var(--ui-ease),
        color var(--ui-fast) var(--ui-ease),
        box-shadow var(--ui-fast) var(--ui-ease),
        filter var(--ui-fast) var(--ui-ease),
        transform var(--ui-fast) var(--ui-ease);
    }

    /* Shared selected state: selected means filled/outlined; open means underlined. */
    .progression-stack .mix-row label.mix-active,
    .meter-panel .meter-choice.selected,
    .choice-tab.active,
    .choice-item.selected {
      background: var(--surface-selected) !important;
      color: var(--text-primary) !important;
      border-color: var(--border-strong) !important;
      box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.16),
        inset 0 1px 0 rgba(255,255,255,.07) !important;
    }

    /* Secondary labels are deliberately quieter than the value being chosen. */
    .browser-trigger .trigger-label,
    .row-heading,
    .section-heading {
      color: var(--text-tertiary);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .09em;

    }

    .browser-trigger .trigger-value {
      color: var(--text-primary);

    .accompaniment-control .trigger-label {

    .accompaniment-control .trigger-value {
      color: #f5f6f7;
      font-size: 15px;
      font-weight: 820;
      letter-spacing: -.012em;
    }

    /* Navigation/open state: icon brightness alone indicates the open section. */
    .detail-tabs {
      gap: 0;
    }

    .detail-tab {
      color: var(--text-tertiary);
      font-size: 12px;
      font-weight: 780;
      letter-spacing: .005em;
      transition:
        color var(--ui-fast) var(--ui-ease),
        opacity var(--ui-fast) var(--ui-ease);
    }

    .detail-tab.active {
      color: var(--text-primary);
    }

    /* Popup hierarchy and rhythm match the main controls. */
    .choice-head {
      padding: var(--space-3) var(--space-3) 10px;
    }

    .choice-title {
      font-size: 17px;
      font-weight: 850;
      letter-spacing: -.015em;
    }

    .choice-tabs {

    .choice-grid {

    }

    .choice-item {

    .choice-item .choice-name {

    /* Numerals and tempo read more cleanly without changing geometry. */

    /* Slightly clearer separation of interactive rows from the board. */

      s = s.replace(/-/g,"♭").replace(/#/g,"♯");
      // Harm annotations can append quality and inversion codes. The top
      // line and interval row now carry those details, so the center retains
      // just harmonic function.
      s = s.replace(/([ivIV]+)(?:m7|M7|\+7|o7|ø7|7|m|o|\+)?[bcdefg]?$/,"$1");
      s = s.replace(/([ivIV]+)(?:m7|M7|\+7|o7|ø7|7|m|o|\+)?[bcdefg]?(\/)/g,"$1$2");
      return s;
    }

    function harteDegreeInterval(token) {
      var map = {
        "1":0,"b2":1,"2":2,"#2":3,"b3":3,"3":4,"4":5,"#4":6,"b5":6,
        "5":7,"#5":8,"b6":8,"6":9,"bb7":9,"b7":10,"7":11,
        "8":12,"b9":13,"9":14,"#9":15,"11":17,"#11":18,"b13":20,"13":21
      };
      return map.hasOwnProperty(token) ? map[token] : null;
    }

    function uniqueSortedIntervals(values) {
      var seen={}, out=[];
      values.forEach(function(v){
        if (v===null || v===undefined || !isFinite(v)) return;
        var key=String(v);
        if(!seen[key]) { seen[key]=true; out.push(v); }
      });
      out.sort(function(a,b){return a-b;});
      return out;
    }

    function parseHarteQuality(q) {
      q = (q || "maj").trim();
      var base=q, additions=[];
      var pm=q.match(/^([^()]*)\(([^)]*)\)$/);
      if(pm) {
        base=pm[1] || "";
        additions=pm[2].split(",").map(function(x){return x.trim();}).filter(Boolean);
      }

      var intervals, label;
      switch(base) {
        case "": case "maj": intervals=[0,4,7]; label=""; break;
        case "min": intervals=[0,3,7]; label="m"; break;
        case "7": intervals=[0,4,7,10]; label="7"; break;
        case "min7": intervals=[0,3,7,10]; label="m7"; break;
        case "maj7": intervals=[0,4,7,11]; label="maj7"; break;
        case "5": intervals=[0,7]; label="5"; break;
        case "1": intervals=[0]; label=""; break;
        case "sus2": intervals=[0,2,7]; label="sus2"; break;
        case "sus4": intervals=[0,5,7]; label="sus4"; break;
        case "maj6": intervals=[0,4,7,9]; label="6"; break;
        case "min6": intervals=[0,3,7,9]; label="m6"; break;
        case "dim": intervals=[0,3,6]; label="°"; break;
        case "dim7": intervals=[0,3,6,9]; label="°7"; break;
        case "hdim7": intervals=[0,3,6,10]; label="ø7"; break;
        case "aug": intervals=[0,4,8]; label="+"; break;
        case "minmaj7": intervals=[0,3,7,11]; label="m(maj7)"; break;
        case "9": intervals=[0,4,7,10,14]; label="9"; break;
        case "min9": intervals=[0,3,7,10,14]; label="m9"; break;
        case "maj9": intervals=[0,4,7,11,14]; label="maj9"; break;
        case "11": intervals=[0,4,7,10,14,17]; label="11"; break;
        case "min11": intervals=[0,3,7,10,14,17]; label="m11"; break;
        case "13": intervals=[0,4,7,10,14,21]; label="13"; break;
        case "min13": intervals=[0,3,7,10,14,17,21]; label="m13"; break;
        case "maj13": intervals=[0,4,7,11,14,21]; label="maj13"; break;
        default:
          intervals=[0,4,7];
          label=base.replace(/min/g,"m").replace(/hdim7/g,"ø7").replace(/dim7/g,"°7").replace(/dim/g,"°");
      }

      additions.forEach(function(a){
        var ai=harteDegreeInterval(a);
        if(ai!==null) intervals.push(ai);
      });
      intervals=uniqueSortedIntervals(intervals);

      // Conventional compact labels for the most common "added tone" forms.
      if (additions.length && (base==="maj" || base==="min")) {
        var addText=additions.map(function(a){
          return a.replace(/^b/,"♭").replace(/^#/,"♯");
        }).join(",");
        if (additions.length===1 && ["9","11","13"].indexOf(additions[0])!==-1) {
          label=(base==="min" ? "m" : "")+"add"+addText;
        } else {
          label=(base==="min" ? "m" : "")+"("+addText+")";
        }
      } else if (additions.length) {
        var extra=additions.map(function(a){return a.replace(/^b/,"♭").replace(/^#/,"♯");}).join(",");
        label += "("+extra+")";
      }
      return {intervals:intervals,label:label};
    }

    function songChordInfoFromRaw(raw) {
      if (!raw) return null;
      var s=String(raw);
      var colon=s.indexOf(":");
      var rootPart=colon>=0 ? s.slice(0,colon) : s;
      var qualityPart=colon>=0 ? s.slice(colon+1) : "maj";
      var slash="";
      var slashIndex=qualityPart.lastIndexOf("/");
      if(slashIndex>0) {
        slash=qualityPart.slice(slashIndex+1);
        qualityPart=qualityPart.slice(0,slashIndex);
      }
      var rootName=circlePitchNameFromHarte(rootPart);
      var rootPC=PC_MAP[rootName];
      if(rootPC===undefined) return null;
      var parsed=parseHarteQuality(qualityPart);
      var rootMidi=60+rootPC;
      var midi=parsed.intervals.map(function(i){return rootMidi+i;});
      var quality=(parsed.intervals.indexOf(3)!==-1) ? "minor" :
                  (parsed.intervals.indexOf(6)!==-1 && parsed.intervals.indexOf(4)===-1 ? "dim" : "major");
      return {
        midiNotes:midi,
        chordKey:null,
        chordRing:null,
        pitchClass:rootPC,
        quality:quality,
        songQualityLabel:parsed.label,
        songRootName:rootName,
        songSlashBass:circlePitchNameFromHarte(slash),
        rawHarte:raw
      };
    }

    function songPulsesForQuarterDuration(q, meter) {
      var n=parseFloat(q);
      if(!isFinite(n) || n<=0) n=1;
      var compound=(meter==="6/8" || meter==="12/8");
      var pulses=compound ? n/1.5 : n;
      // v1.110 transport remains pulse-based. Preserve ordinary beat-aligned
      // durations exactly and keep shorter source events visible as one pulse.
      return Math.max(1, Math.round(pulses));
    }

    function buildSongProgression(song) {
      var steps=[], pendingSection=null;
      var keyTonic=(song.key && song.key.tonic) ? circlePitchNameFromHarte(song.key.tonic) : "C";
      var keyMode=(song.key && song.key.mode) ? song.key.mode : "major";
      var meter=song.meter || "4/4";

      (song.events || []).forEach(function(e){
        if(!e || !e.length) return;
        if(e[0]==="s") {
          pendingSection=(e[2] || "").trim() || null;
          return;
        }
        if(e[0]==="k") {
          keyTonic=circlePitchNameFromHarte(e[3] || keyTonic);
          keyMode=e[4] || keyMode;
          return;
        }
        if(e[0]==="m") {
          meter=e[2] || meter;
          return;
        }
        if(e[0]!=="c") return;
        var raw=e[2], roman=e[3] || "?";
        var info=songChordInfoFromRaw(raw);
        if(!info) return;
        var step={
          romanRaw:roman,
          roman:romanFunctionOnly(roman),
          rawHarte:raw,
          info:info,
          beats:songPulsesForQuarterDuration(e[1],meter),
          sourceQuarterDuration:parseFloat(e[1]) || 1,
          measure:e[4],
          sectionBefore:pendingSection,
          keyTonic:keyTonic,
          keyMode:keyMode,
          meter:meter
        };
        pendingSection=null;

        // Collapse adjacent identical harmonies only when no structural
        // boundary, key change, or meter change separates them.
        var prev=steps.length ? steps[steps.length-1] : null;
        if(prev && !step.sectionBefore &&
           prev.rawHarte===step.rawHarte &&
           prev.romanRaw===step.romanRaw &&
           prev.keyTonic===step.keyTonic &&
           prev.keyMode===step.keyMode &&
           prev.meter===step.meter) {
          prev.beats += step.beats;
          prev.sourceQuarterDuration += step.sourceQuarterDuration;
        } else {
          steps.push(step);
        }
      });

      return {
        isSong:true,
        song:song,
        steps:steps,
        degrees:steps.map(function(s){return s.roman;}),
        beats:steps.map(function(s){return s.beats;}),
        baseBeats:steps.map(function(s){return s.beats;}),
        sessionEdited:false
      };
    }

    function progressionChordInfo(prog,index) {
      if(prog && prog.isSong && prog.steps && prog.steps[index]) return prog.steps[index].info;
      if(!prog || !prog.degrees || index<0 || index>=prog.degrees.length) return null;
      return chordInfoForDegree(selectedMajor,prog.degrees[index]);
    }

    function songStepIsDiatonic(step) {
      if(!step || !step.info || !step.info.midiNotes) return false;
      var tonicPC=PC_MAP[step.keyTonic];
      if(tonicPC===undefined) return false;
      var mode=songModeName(step.keyMode);
      var allowed=modeScalePitchClasses(tonicPC,mode);
      for(var i=0;i<step.info.midiNotes.length;i++) {
        var pc=((step.info.midiNotes[i]%12)+12)%12;
        if(!allowed[pc]) return false;
      }
      return true;
    }

    function progressionStepIsDiatonic(prog,index,mode) {
      if(prog && prog.isSong) return songStepIsDiatonic(prog.steps[index]);
      return isDegreeDiatonic(prog.degrees[index],mode);
    }

    function songIntervalDisplay(step) {
      if(!step || !step.info || !step.info.midiNotes) return [];
      var tonicPC=PC_MAP[step.keyTonic];
      if(tonicPC===undefined) tonicPC=0;
      var mode=songModeName(step.keyMode);
      var allowed=modeScalePitchClasses(tonicPC,mode);
      var preferSharp=/♯|#/.test(step.romanRaw||"");
      return step.info.midiNotes.map(function(midi){
        var pc=((midi%12)+12)%12;
        return {
          label:intervalLabelFromTonic(pc-tonicPC,preferSharp,mode),
          diatonic:!!allowed[pc]
        };
      });
    }

    function songMiddleLabel(step, letterView) {
      if(!step) return "?";
      if(letterView) return step.info.songRootName || "?";
      return step.roman || "?";
    }

    function songQualityLabel(step) {
      if(!step || !step.info) return "";
      var label=step.info.songQualityLabel || "";
      if(step.info.songSlashBass) {
        label += (label ? " " : "") + "/" + step.info.songSlashBass;
      }
      return label;
    }

    function songSectionDisplayName(raw) {
      var s=(raw||"").trim();
      if(!s) return "";
      var map={intro:"INTRO",verse:"VERSE",chorus:"CHORUS",bridge:"BRIDGE",
               refrain:"REFRAIN",interlude:"INTERLUDE",outro:"OUTRO",
               prechorus:"PRE",solo:"SOLO"};
      return map[s.toLowerCase()] || s.toUpperCase().slice(0,9);
    }

    function setProgressionTriggerForSong() {
      var btn=document.getElementById("progressionSelectTrigger");
      if(!btn) return;
      var main=btn.querySelector(".main-value");
      if(main) main.textContent=activeSong ? "Song" : compactProgressionTriggerLabel(selectedOptionFor(document.getElementById("progressionSelect")));
    }

    function activateSong(song) {
      if(!song) return;
      stopProgressionPlayback();
      discardWorkingProgressionDraft();
      activeSong=song;
      activeSongProgression=buildSongProgression(song);
      activeSongMode=songModeName(song.key && song.key.mode);
      var tonic=(song.key && song.key.tonic) ? circlePitchNameFromHarte(song.key.tonic) : "C";
      if(PC_MAP.hasOwnProperty(tonic)) selectedMajor=canonicalMajorForPitchClass(PC_MAP[tonic]);
      if(["4/4","3/4","6/8","12/8","2/4"].indexOf(song.meter)!==-1) {
        setCircleTimeSignature(song.meter);
      }
      stoppedDisplayState=0;
      chordLetterView=false;
      beatEditorState=null;
      progressionStripSelectionKey="";
      setProgressionTriggerForSong();
      transportVisualStateKey="";
      render(selectedMajor);
      renderProgressionStrip(null,null,false);
      renderSongResults();
    }

    function clearActiveSong() {
      activeSong=null;
      activeSongProgression=null;
      activeSongMode="ionian";
      setProgressionTriggerForSong();
    }

    function songSortValue(song) {
      return String(songSearchMode==="artist" ? song.artist : song.title).toLowerCase();
    }

    function filteredSongs() {
      var input=document.getElementById("songSearchInput");
      var q=input ? input.value.trim().toLowerCase() : "";
      var arr=songLibrary.slice().sort(function(a,b){
        var av=songSortValue(a), bv=songSortValue(b);
        if(av<bv) return -1; if(av>bv) return 1;
        return String(a.title).localeCompare(String(b.title));
      });
      if(!q) return arr;
      return arr.filter(function(song){
        var value=String(songSearchMode==="artist" ? song.artist : song.title).toLowerCase();
        return songSearchContains ? value.indexOf(q)!==-1 : value.indexOf(q)===0;
      });
    }

    function renderSongResults() {
      var host=document.getElementById("songResults");
      var status=document.getElementById("songLibraryStatus");
      if(!host) return;
      host.innerHTML="";
      if(songLibraryLoading) {
        if(status) status.textContent="Loading song library…";
        return;
      }
      if(songLibraryError) {
        if(status) status.textContent=songLibraryError;
        return;
      }
      var matches=filteredSongs();
      if(status) {
        status.textContent=(songSearchContains ? "Contains · " : "Starts with · ") +
          matches.length+" of "+songLibrary.length+" songs";
      }
      if(!matches.length) {
        var empty=document.createElement("div");
        empty.className="song-result-empty";
        empty.textContent="No matching songs";
        host.appendChild(empty);
        return;
      }
      matches.forEach(function(song){
        var b=document.createElement("button");
        b.type="button";
        b.className="song-result"+(activeSong && activeSong.id===song.id ? " selected" : "");
        var title=document.createElement("div");
        title.className="song-result-title";
        title.textContent=song.title;
        var artist=document.createElement("div");
        artist.className="song-result-artist";
        artist.textContent=song.artist;
        b.appendChild(title); b.appendChild(artist);
        b.addEventListener("click",function(){ activateSong(song); });
        host.appendChild(b);
      });
    }

    function loadSongLibrary() {
      if(songLibraryLoaded || songLibraryLoading) return;
      songLibraryLoading=true;
      songLibraryError="";
      renderSongResults();
      fetch("Circle_song_library.json",{cache:"no-store"}).then(function(r){
        if(!r.ok) throw new Error("HTTP "+r.status);
        return r.json();
      }).then(function(data){
        songLibrary=Array.isArray(data) ? data : (data.songs || []);
        songLibraryLoaded=true;
        songLibraryLoading=false;
        renderSongResults();
      }).catch(function(){
        songLibraryLoading=false;
        songLibraryError="Song library not found. Keep Circle_song_library.json beside index.html.";
        renderSongResults();
      });
    }

    function setSongSearchMode(mode) {
      songSearchMode=(mode==="artist") ? "artist" : "title";
      songSearchContains=false;
      var t=document.getElementById("songModeTitle"), a=document.getElementById("songModeArtist");
      if(t) t.classList.toggle("active",songSearchMode==="title");
      if(a) a.classList.toggle("active",songSearchMode==="artist");
      renderSongResults();
    }

    function openSongBrowser() {
      if(!activeBrowserSelect || activeBrowserSelect.id!=="progressionSelect") return;
      songBrowserOpen=true;
      var songBtn=document.getElementById("choiceSong");
      var sb=document.getElementById("songBrowser");
      var tabs=document.getElementById("choiceTabs");

    function closeSongBrowserView() {
      songBrowserOpen=false;
      var songBtn=document.getElementById("choiceSong");
      var sb=document.getElementById("songBrowser");
      var tabs=document.getElementById("choiceTabs");
      var grid=document.getElementById("choiceGrid");
      if(songBtn) songBtn.classList.remove("active");
      if(sb) { sb.classList.remove("open"); sb.setAttribute("aria-hidden","true"); }
      if(tabs) tabs.style.display="";
      if(grid) grid.style.display="";
      if(activeBrowserSelect) {
        var cfg=selectorBrowserConfig[activeBrowserSelect.id];
        document.getElementById("choiceTitle").textContent=cfg ? cfg.title : "Choose";
      }
    }

    function progressionModeForSelection() {
      if (activeSong) return activeSongMode || "ionian";
      var select = document.getElementById("progressionSelect");
      var opt = select && select.options ? select.options[select.selectedIndex] : null;
      var group = (opt && opt.parentElement && opt.parentElement.tagName === "OPTGROUP")
        ? opt.parentElement.label : "";
      var text = ((group || "") + " " + (opt ? opt.textContent : "")).toLowerCase();

      // The selected progression defines the active modal collection.
      // The clicked note remains the tonal center; the parent major key is
      // derived from center + mode rather than the other way around.
      if (text.indexOf("dorian") !== -1) return "dorian";
      if (text.indexOf("phrygian") !== -1) return "phrygian";
      // Test Mixolydian before Lydian because "mixolydian" contains
      // the substring "lydian".
      if (text.indexOf("mixolydian") !== -1) return "mixolydian";
      if (text.indexOf("lydian") !== -1) return "lydian";
      if (text.indexOf("locrian") !== -1) return "locrian";
      if (text.indexOf("aeolian") !== -1 || text.indexOf("minor blues") !== -1) return "aeolian";
      return "ionian";
    }

    function progressionModeForDegrees(degrees) {
      // Keep the old argument for callers, but mode now comes from the
      // selected progression family. This prevents a modal progression from
      // being colored against parallel major/minor by mistake.
      return progressionModeForSelection();
    }

    function canonicalMajorForPitchClass(pc) {
      var byPC = ["C","Db","D","Eb","E","F","F#","G","Ab","A","Bb","B"];
      return byPC[((pc % 12) + 12) % 12];
    }

    function parentMajorForMode(tonicKey, mode) {
      var tonicName = KEY_NOTES[tonicKey] ? KEY_NOTES[tonicKey][0] : tonicKey;
      var tonicPC = PC_MAP[tonicName];
      var modalDegreeOffset = {
        ionian:0, dorian:2, phrygian:4, lydian:5,
        mixolydian:7, aeolian:9, locrian:11
      };
      var offset = modalDegreeOffset.hasOwnProperty(mode) ? modalDegreeOffset[mode] : 0;
      return canonicalMajorForPitchClass(tonicPC - offset);
    }

    function modeNumber(mode) {
      var numbers = {ionian:1, dorian:2, phrygian:3, lydian:4, mixolydian:5, aeolian:6, locrian:7};
      return numbers[mode] || 1;
    }

    function shortModeName(mode) {
      var names = {
        ionian:"Ionian", dorian:"Dorian", phrygian:"Phrygian",
        lydian:"Lydian", mixolydian:"Mixolydian", aeolian:"Aeolian", locrian:"Locrian"
      };
      return names[mode] || "Ionian";
    }

    function centerModeLabel() {
      var mode = progressionModeForSelection();
      if (modeReferenceView) return modeNumber(mode) + "-Mode";
      return displayMajorForCanonical(selectedMajor) + "-" + shortModeName(mode);
    }

    function romanLabelForChordRelativeToParent(deg, mode) {
      var info = chordInfoForDegree(selectedMajor, deg);
      if (!info || !info.midiNotes || !info.midiNotes.length) return normalizedDegreeLabel(deg);
      var parent = parentMajorForMode(selectedMajor, mode);
      var parentTonicPC = PC_MAP[KEY_NOTES[parent][0]];
      var rootPC = ((info.midiNotes[0] % 12) + 12) % 12;
      var offset = (rootPC - parentTonicPC + 12) % 12;
      var roots = ["I","♭II","II","♭III","III","IV","♯IV","V","♭VI","VI","♭VII","VII"];
      var label = roots[offset];
      if (info.quality === "minor" || info.quality === "dim") {
        label = label.replace(/[IV]+/g, function(x){ return x.toLowerCase(); });
      }
      if (info.quality === "dim") label += "°";
      return label;
    }

    function scaledProgressionBeats(baseBeats) {
      var scale = currentMeter().progressionScale;
      return baseBeats.map(function(value){
        var n = parseFloat(value);
        if (!isFinite(n) || n <= 0) n = 1;
        if (currentTimeSignature === "4/4") return Math.max(1, Math.round(n));
        return Math.max(1, Math.round(n * scale));
      });
    }

    function progressionSessionEditKey() {
      if (activeSong) return "song||" + activeSong.id;
      var s = document.getElementById("progressionSelect");
      if (!s || s.selectedIndex < 0) return currentTimeSignature + "||none";
      var opt = s.options[s.selectedIndex];
      var parent = opt ? opt.parentElement : null;
      var group = (parent && parent.tagName === "OPTGROUP") ? parent.label : "";
      return [currentTimeSignature, group, opt ? opt.textContent.trim() : "", s.value].join("||");
    }

    function discardWorkingProgressionDraft() {
      workingProgressionDraft = null;
      beatEditorState = null;
    }

    function collapseAdjacentProgressionSteps(degrees, beats) {
      var outDegrees = [];
      var outBeats = [];
      for (var i=0; i<degrees.length; i++) {
        var degree = degrees[i];
        var count = parseInt(beats[i],10);
        if (!isFinite(count) || count < 1) count = 1;

        var last = outDegrees.length - 1;
        if (last >= 0 && outDegrees[last] === degree) {
          outBeats[last] += count;
        } else {
          outDegrees.push(degree);
          outBeats.push(count);
        }
      }
      return {degrees:outDegrees, beats:outBeats};
    }

    function getSelectedProgression() {
      if (activeSongProgression) return activeSongProgression;
      var s = document.getElementById("progressionSelect");
      if (!s) return {degrees:[], beats:[], baseBeats:[]};

      var draftKey = progressionSessionEditKey();
      var edit = (workingProgressionDraft && workingProgressionDraft.key === draftKey)
        ? workingProgressionDraft : null;
      if (edit) {
        var collapsedEdit = collapseAdjacentProgressionSteps(edit.degrees.slice(), edit.beats.slice());
        return {
          degrees:collapsedEdit.degrees,
          baseBeats:collapsedEdit.beats.slice(),
          beats:collapsedEdit.beats.slice(),
          sessionEdited:true
        };
      }

      var p = s.value.split("|");
      var rawDegrees = p[0] ? p[0].split("-") : [];
      var base = (p[1] || "").split(",");
      var scaled = scaledProgressionBeats(base);
      var collapsed = collapseAdjacentProgressionSteps(rawDegrees, scaled);
      return {
        degrees:collapsed.degrees,
        baseBeats:collapsed.beats.slice(),
        beats:collapsed.beats.slice(),
        sessionEdited:false
      };
    }

    function commitProgressionBeatEdit(index, beats) {
      if (progressionPlaying) return;
      var prog = getSelectedProgression();
      if (!prog || index < 0 || index >= prog.degrees.length) return;

      var degrees = prog.degrees.slice();
      var counts = prog.beats.map(function(value){
        var n = parseInt(value,10);
        return isFinite(n) && n >= 0 ? n : 1;
      });
      beats = Math.max(0, parseInt(beats,10) || 0);

      if (beats === 0) {
        degrees.splice(index,1);
        counts.splice(index,1);
      } else {
        counts[index] = beats;
      }

      workingProgressionDraft = {
        key:progressionSessionEditKey(),
        degrees:degrees,
        beats:counts
      };
      beatEditorState = null;
      transportVisualStateKey = "";
      render(selectedMajor);
      renderProgressionStrip(null, null, false);
    }

    function closeBeatEditorWithoutCommit() {
      if (!beatEditorState) return;
      beatEditorState = null;
      renderProgressionStrip(null, null, false);
    }

    function openBeatEditor(index, chip) {
      if (progressionPlaying) return;
      var prog = getSelectedProgression();
      if (!prog || index < 0 || index >= prog.degrees.length) return;
      var count = parseInt(prog.beats[index],10);
      if (!isFinite(count) || count < 1) count = 1;
      beatEditorState = { index:index, draft:count };
      renderProgressionStrip(null, null, false);
    }

    function bindProgressionBeatLongPress(chip, index) {
      if (activeSong || !chip || progressionPlaying) return;
      var timer = null;
      var startX = 0, startY = 0;

      function clearTimer() {
        if (timer !== null) { clearTimeout(timer); timer = null; }
      }

      chip.addEventListener("pointerdown", function(ev){
        if (ev.button !== undefined && ev.button !== 0) return;
        if (ev.target && ev.target.closest && ev.target.closest(".beat-editor")) return;
        startX = ev.clientX || 0;
        startY = ev.clientY || 0;
        clearTimer();
        timer = setTimeout(function(){
          timer = null;
          chip._suppressNextClick = true;
          openBeatEditor(index, chip);
        }, beatEditorLongPressMs);
      }, {passive:true});
      chip.addEventListener("pointermove", function(ev){
        if (timer === null) return;
        if (Math.abs((ev.clientX || 0) - startX) > 12 ||
            Math.abs((ev.clientY || 0) - startY) > 12) clearTimer();
      });
      ["pointerup","pointercancel","pointerleave"].forEach(function(type){
        chip.addEventListener(type, clearTimer);
      });
      chip.addEventListener("contextmenu", function(ev){ ev.preventDefault(); });
    }

    function attachBeatEditor(chip, index) {
      if (!beatEditorState || beatEditorState.index !== index || progressionPlaying) return;
      var editor = document.createElement("div");
      editor.className = "beat-editor";
      editor.setAttribute("role", "group");
      editor.setAttribute("aria-label", "Adjust beats");

      minus.textContent = "−";
      minus.setAttribute("aria-label", "Reduce beats");

      var count = document.createElement("button");

      minus.addEventListener("click", function(ev){

      });

    function modeScalePitchClasses(tonicPC, mode) {
      var intervalsByMode = {
        ionian:     [0,2,4,5,7,9,11],
        dorian:     [0,2,3,5,7,9,10],
        phrygian:   [0,1,3,5,7,8,10],
        lydian:     [0,2,4,6,7,9,11],
        mixolydian: [0,2,4,5,7,9,10],
        aeolian:    [0,2,3,5,7,8,10],
        locrian:    [0,1,3,5,6,8,10]
      };
      var ints = intervalsByMode[mode] || intervalsByMode.ionian;
      var out={};
      for(var i=0;i<ints.length;i++) out[(tonicPC+ints[i])%12]=true;
      return out;
    }

    function isDegreeDiatonic(deg, mode) {
      var info = chordInfoForDegree(selectedMajor, deg);
      if (!info || !info.midiNotes || !info.midiNotes.length) return false;
      var tonicPC = PC_MAP[KEY_NOTES[selectedMajor][0]];
      var allowed = modeScalePitchClasses(tonicPC, mode || "ionian");
      for (var i=0; i<info.midiNotes.length; i++) {
        var pc = ((info.midiNotes[i] % 12) + 12) % 12;
        if (!allowed[pc]) return false;
      }
      return true;
    }
    function intervalLabelFromTonic(n, preferSharp, referenceMode) {
      var pc=((n%12)+12)%12;
      var flatLabels  = ["1","♭2","2","♭3","3","4","♭5","5","♭6","6","♭7","7"];
      var sharpLabels = ["1","♯1","2","♯2","3","4","♯4","5","♯5","6","♯6","7"];

      // In a Minor/Aeolian reference frame, plain 3, 6, and 7 are
      // restorations of ♭3, ♭6, and ♭7. Mark them explicitly as naturals
      // so the annotation reads as an alteration of the reference scale,
      // not merely as an interval number.
      if (referenceMode === "aeolian") {
        if (pc === 4)  return "♮3";
        if (pc === 9)  return "♮6";
        if (pc === 11) return "♮7";
      }

      return (preferSharp ? sharpLabels : flatLabels)[pc];
    }

    function triadIntervalDisplayForDegree(deg, mode) {
      var info = chordInfoForDegree(selectedMajor, deg);
      if (!info || !info.midiNotes) return [];

      var chroma = {
        C:0,"C#":1,Db:1,D:2,"D#":3,Eb:3,E:4,F:5,
        "F#":6,Gb:6,G:7,"G#":8,Ab:8,A:9,"A#":10,Bb:10,B:11
      };
      var modalTonic = chroma[KEY_NOTES[selectedMajor][0]];
      var allowed = modeScalePitchClasses(modalTonic, mode);
      var referenceTonic = modalTonic;
      var referenceMode = mode;

      // In the tapped 1–7 Mode view, interval numbers are referenced to
      // the parent major key while the green/red test remains the active
      // modal collection. Example: G Mixolydian -> C-major interval numbers.
      if (modeReferenceView) {
        var parent = parentMajorForMode(selectedMajor, mode);
        referenceTonic = chroma[KEY_NOTES[parent][0]];
        referenceMode = "ionian";
      }

      // Preserve Circle's established functional spelling:
      // raised tones in major-function chromatic chords use sharps;
      // borrowed/modal-flat functions use flats.
      var preferSharp = ["II","III","VI","V2","V5","V6"].indexOf(deg) !== -1;

      return info.midiNotes.map(function(midi){
        var pc = ((midi % 12) + 12) % 12;
        return {
          label: intervalLabelFromTonic(pc - referenceTonic, preferSharp, referenceMode),
          diatonic: !!allowed[pc]
        };
      });
    }


    function chordNameForDegree(deg) {
      var info = chordInfoForDegree(selectedMajor, deg);
      if (!info || !info.midiNotes || !info.midiNotes.length) return normalizedDegreeLabel(deg);
      var rootPC = ((info.midiNotes[0] % 12) + 12) % 12;
      var root = displayPitchClass(rootPC, selectedSpellingPreference);
      var suffix = "";
      if (info.seventhKind === "maj7") suffix = "maj7";
      else if (info.seventhKind === "min7") suffix = "m7";
      else if (info.seventhKind === "half-dim") suffix = "ø7";
      else if (info.seventhKind === "dim7") suffix = "°7";
      else if (info.seventhKind === "dom7") suffix = "7";
      else if (info.quality === "minor") suffix = "m";
      else if (info.quality === "dim") suffix = info.midiNotes.length >= 4 ? "°7" : "°";
      else if (info.midiNotes.length >= 4) suffix = "7";
      return root + suffix;
    }

    function romanLabelForWheelChord(rootPC, quality) {
      var mode = progressionModeForSelection();
      var referenceKey = modeReferenceView ? parentMajorForMode(selectedMajor, mode) : selectedMajor;
      var referenceTonicPC = PC_MAP[KEY_NOTES[referenceKey][0]];
      var offset = ((rootPC - referenceTonicPC) % 12 + 12) % 12;
      var roots = ["I","♭II","II","♭III","III","IV","♯IV","V","♭VI","VI","♭VII","VII"];
      var label = roots[offset];
      if (quality === "minor" || quality === "dim") {
        label = label.replace(/[IV]+/g, function(x){ return x.toLowerCase(); });
      }
      if (quality === "dim") label += "°";
      return label;
    }

    function isIndependentCircleView() {
      return !progressionPlaying && stoppedDisplayState === 2;
    }

    function independentDiatonicChordClasses() {
      var inPC = {}, outPC = {};
      var tonicPC = independentDiatonicRootPC;
      if (tonicPC === null || tonicPC === undefined) {
        tonicPC = PC_MAP[KEY_NOTES[selectedMajor][0]];
      }
      tonicPC = ((tonicPC % 12) + 12) % 12;

      // Major centers use Ionian, minor centers use natural minor/Aeolian,
      // and a diminished center uses Locrian. This makes the selected chord
      // a genuine modal center while keeping the palette strictly diatonic.
      var scaleIntervals = independentDiatonicQuality === "minor"
        ? [0,2,3,5,7,8,10]
        : independentDiatonicQuality === "dim"
          ? [0,1,3,5,6,8,10]
          : [0,2,4,5,7,9,11];
      var allowed = {};
      for (var i=0; i<scaleIntervals.length; i++) {
        allowed[(tonicPC + scaleIntervals[i]) % 12] = true;
      }

      function allAllowed(rootPC, intervals) {
        for (var j=0; j<intervals.length; j++) {
          if (!allowed[(rootPC + intervals[j]) % 12]) return false;
        }
        return true;
      }

      for (var pc=0; pc<12; pc++) {
        if (allAllowed(pc,[0,4,7])) inPC[pc + ":major"] = true;
        if (allAllowed(pc,[0,3,7])) inPC[pc + ":minor"] = true;
        if (allAllowed(pc,[0,3,6])) inPC[pc + ":dim"] = true;
      }
      return {inPC:inPC,outPC:outPC};
    }

    function independentChordIsDiatonic(rootPC, quality) {
      var map = independentDiatonicChordClasses();
      return !!map.inPC[(((rootPC % 12) + 12) % 12) + ":" + quality];
    }

    function clearProgressionVoiceArray() {
      for (var i=0; i<progressionOscillators.length; i++) {
        try {
          var item = progressionOscillators[i];
          if (item.gain && item.gain.gain) {
            item.gain.gain.cancelScheduledValues(0);
            item.gain.gain.setTargetAtTime(0.0001, item.ctx.currentTime, 0.03);
          }
          if (item.osc && item.osc.stop) item.osc.stop(item.ctx.currentTime + 0.08);
          if (item.source && item.source.stop) item.source.stop(item.ctx.currentTime + 0.08);
        } catch (e) {}
      }
      progressionOscillators = [];
    }

    function stopChordAudition(skipRender) {
      if (chordAuditionTimer) {
        clearInterval(chordAuditionTimer);
        chordAuditionTimer = null;
      }
      chordAuditionRunning = false;
      chordAuditionInfo = null;
      chordAuditionChordKey = null;
      chordAuditionChordRing = null;
      clearProgressionVoiceArray();
      activeRoman = null;
      activeChordKey = null;
      activeChordRing = null;
      activePitchClass = null;
      activeQuality = null;
      activeIsDiatonic = null;
      if (!skipRender) render(selectedMajor);
    }

    function wheelChordInfo(rootPC, quality) {
      var rootMidi = 60 + (((rootPC % 12) + 12) % 12);
      var intervals = quality === "minor" ? [0,3,7] : quality === "dim" ? [0,3,6] : [0,4,7];
      return {
        midiNotes: intervals.map(function(n){ return rootMidi + n; }),
        pitchClass: ((rootPC % 12) + 12) % 12,
        quality: quality
      };
    }

    function scheduleAuditionBassBeat(ctx, when, beatNumber, beatSeconds) {
      if (!chordAuditionInfo) return;
      var events = selectedBassPatternEvents();
      var beatsForChord = meterPulsesPerMeasure();
      var beatInChord = ((beatNumber % beatsForChord) + beatsForChord) % beatsForChord;

      for (var i=0; i<events.length; i++) {
        for (var base=0; base<beatsForChord; base+=meterPulsesPerMeasure()) {
          var pos = base + events[i].beat;
          if (pos >= beatsForChord) continue;
          if (Math.floor(pos + 1e-9) !== beatInChord) continue;
          var fraction = pos - beatInChord;
          var noteWhen = when + fraction * beatSeconds;
          var remaining = (beatsForChord - pos) * beatSeconds;
          var dur = Math.max(0.07, Math.min(beatSeconds * 0.72, remaining - 0.025));
          renderBassEvent(ctx, bassMidiForKind(chordAuditionInfo, events[i].kind), dur, noteWhen);
        }
      }
    }

    function scheduleAuditionGuitarBeat(ctx, when, beatNumber, beatSeconds) {
      if (!chordAuditionInfo) return;
      var events = selectedGuitarPatternEvents();
      var beatsForChord = meterPulsesPerMeasure();
      var beatInChord = ((beatNumber % beatsForChord) + beatsForChord) % beatsForChord;

      for (var i=0; i<events.length; i++) {
        var kind = events[i].kind;
        for (var base=0; base<beatsForChord; base+=meterPulsesPerMeasure()) {
          var pos = base + events[i].beat;
          if (pos >= beatsForChord) continue;
          if (Math.floor(pos + 1e-9) !== beatInChord) continue;
          var fraction = pos - beatInChord;
          var noteWhen = when + fraction * beatSeconds;
          var remaining = (beatsForChord - pos) * beatSeconds;

          if (kind === "C") {
            var chordDur = Math.max(0.07, Math.min(beatSeconds * 0.50, remaining - 0.065));
            renderGuitarChordEvent(ctx, chordAuditionInfo.midiNotes, chordDur, noteWhen);
          } else if (kind.charAt(0) === "A") {
            var a = parseInt(kind.slice(1),10);
            a = Math.max(0,Math.min(chordAuditionInfo.midiNotes.length-1,isFinite(a)?a:0));
            var arpDur = Math.max(0.07, Math.min(beatSeconds * 0.42, remaining - 0.025));
            renderGuitarArpEvent(ctx, chordAuditionInfo.midiNotes[a], arpDur, noteWhen);
          }
        }
      }
    }

    function runChordAuditionScheduler() {
      if (!chordAuditionRunning || !chordAuditionInfo) return;
      var ctx = getAudioCtx();
      var beatSeconds = getTransportBeatSeconds();
      while (chordAuditionNextBeatTime < ctx.currentTime + transportScheduleAheadSec) {
        var bassToggle = document.getElementById("bassToggle");
        var guitarToggle = document.getElementById("chordToggle");
        if (!bassToggle || bassToggle.checked) {
          scheduleAuditionBassBeat(ctx, chordAuditionNextBeatTime, chordAuditionBeatNumber, beatSeconds);
        }
        if (!guitarToggle || guitarToggle.checked) {
          scheduleAuditionGuitarBeat(ctx, chordAuditionNextBeatTime, chordAuditionBeatNumber, beatSeconds);
        }
        // Deliberately no percussion or click in independent Sound mode.
        chordAuditionBeatNumber += 1;
        chordAuditionNextBeatTime += beatSeconds;
      }
    }

    function startChordAudition(rootPC, quality, chordKey, chordRing) {
      if (progressionPlaying || !isIndependentCircleView() || independentCircleMode !== "sound") return;

      if (chordAuditionRunning &&
          chordAuditionInfo &&
          chordAuditionInfo.pitchClass === rootPC &&
          chordAuditionInfo.quality === quality) {
        stopChordAudition();
        return;
      }

      stopArpeggioOnly();
      stopChordAudition(true);

      ensureAudioReady(function(ctx){
        Promise.all([loadBassSamples(ctx), loadGuitarSamples(ctx)]).then(function(){
          if (progressionPlaying || !isIndependentCircleView() || independentCircleMode !== "sound") return;
          chordAuditionInfo = wheelChordInfo(rootPC, quality);
          chordAuditionChordKey = chordKey;
          chordAuditionChordRing = chordRing;
          chordAuditionRunning = true;
          chordAuditionBeatNumber = 0;
          chordAuditionNextBeatTime = ctx.currentTime + 0.04;

          activeRoman = null;
          activeChordKey = chordKey;
          activeChordRing = chordRing;
          activePitchClass = rootPC;
          activeQuality = quality;
          activeIsDiatonic = independentChordIsDiatonic(rootPC, quality);

          render(selectedMajor);
          runChordAuditionScheduler();
          chordAuditionTimer = setInterval(runChordAuditionScheduler, transportLookaheadMs);
        });
      });
    }

    function setStoppedDisplayState(state) {
      if (progressionPlaying) return;
      stopChordAudition(true);
      stopArpeggioOnly();

      var next = ((state % 3) + 3) % 3;
      stoppedDisplayState = next;
      chordLetterView = (next === 1);

      if (next === 2) {
        // Each entry into the independent view begins from the app's current
        // key as a major/Ionian diatonic palette. Diatonic and Sound then share
        // that palette until the user chooses another center in Diatonic mode.
        independentCircleMode = "diatonic";
        independentDiatonicRootPC = PC_MAP[KEY_NOTES[selectedMajor][0]];
        independentDiatonicQuality = "major";
      }

      render(selectedMajor);
      renderProgressionStrip(null, null, false);
    }

    function setChordLetterView(on) {
      setStoppedDisplayState(on ? 1 : 0);
    }

    function toggleChordLetterView() {
      if (progressionPlaying) return;
      setStoppedDisplayState((stoppedDisplayState + 1) % 3);
    }


    function progressionStripTargetLeft(host, chipIndex) {
      if (!host || chipIndex === null || chipIndex === undefined || chipIndex < 0) return 0;
      var chips = host.querySelectorAll(".prog-chip");
      if (!chips.length || !chips[chipIndex]) return 0;
      var chip = chips[chipIndex];
      var playheadX = host.clientWidth * 0.375;
      var desired = chip.offsetLeft + chip.offsetWidth / 2 - playheadX;
      var maxScroll = Math.max(0, host.scrollWidth - host.clientWidth);
      return Math.max(0, Math.min(maxScroll, desired));
    }

    function updateProgressionStripViewport(host, prog, activeIndex, cueIndex, cueLit, savedScrollLeft, sameSelection) {
      if (!host) return;
      var shell = host.closest ? host.closest(".progression-strip-shell") : null;
      var isLong = !!(prog && prog.degrees && prog.degrees.length > 4);
      host.classList.toggle("long-strip", isLong);
      if (shell) shell.classList.toggle("following", isLong && progressionPlaying);

      if (!isLong) {
        host.scrollLeft = 0;
        return;
      }

      // Let layout settle so offsetLeft/scrollWidth reflect the fixed four-slot
      // geometry before restoring or following the timeline.
      requestAnimationFrame(function(){
        var maxScroll = Math.max(0, host.scrollWidth - host.clientWidth);

        if (!progressionPlaying) {
          host.scrollLeft = sameSelection ? Math.min(savedScrollLeft || 0, maxScroll) : 0;
          return;
        }

        var targetIndex = (activeIndex === null || activeIndex === undefined) ? 0 : activeIndex;
        var smoothApproach = false;

        // On the final beat, move the NEXT chord toward the stationary playhead
        // while the current chord remains the active/highlighted harmony. At
        // the actual beat boundary only the highlight/audio state changes.
        if (cueLit === true && cueIndex !== null && cueIndex !== undefined && cueIndex !== activeIndex) {
          var isLoopWrap = activeIndex === prog.degrees.length - 1 && cueIndex === 0;
          if (!isLoopWrap) {
            targetIndex = cueIndex;
            smoothApproach = true;
          }
        }

        var targetLeft = progressionStripTargetLeft(host, targetIndex);
        if (smoothApproach && typeof host.scrollTo === "function") {
          host.scrollTo({left:targetLeft, behavior:"smooth"});
        } else {
          // Loop-back deliberately snaps rather than sweeping backward through
          // the whole form, and ordinary beat updates hold a stable position.
          host.scrollLeft = targetLeft;
        }
      });
    }

    function renderProgressionStrip(activeIndex, cueIndex, cueLit) {
      var host = document.getElementById("progressionStrip");
      if (!host) return;
      var savedScrollLeft = host.scrollLeft || 0;
      var selectionKey = progressionSessionEditKey();
      var sameSelection = selectionKey === progressionStripSelectionKey;
      progressionStripSelectionKey = selectionKey;
      var prog = getSelectedProgression();
      var mode = progressionModeForDegrees(prog.degrees);
      host.innerHTML = "";
      host.classList.toggle("blank-view", !progressionPlaying && stoppedDisplayState === 2);
      host.onclick = null;
      host.removeAttribute("role");
      host.removeAttribute("aria-label");

      // Third stopped-state view: keep the lower progression area blank except
      // for a square Back button that returns directly to Roman numerals.
      if (!progressionPlaying && stoppedDisplayState === 2) {
        beatEditorState = null;
        host.classList.remove("long-strip");
        var blankShell = host.closest ? host.closest(".progression-strip-shell") : null;
        if (blankShell) blankShell.classList.remove("following");
        host.scrollLeft = 0;
        var backButton = document.createElement("button");
        backButton.type = "button";
        backButton.className = "progression-back-button";
        backButton.textContent = "←";
        backButton.setAttribute("aria-label", "Back to Roman numerals");
        backButton.addEventListener("click", function(ev){
          ev.stopPropagation();
          setStoppedDisplayState(0);
        });
        host.appendChild(backButton);
        return;
      }

      for (var i=0; i<prog.degrees.length; i++) {
        var d = prog.degrees[i];
        var songStep = (prog.isSong && prog.steps) ? prog.steps[i] : null;

        if (songStep && songStep.sectionBefore) {
          var marker=document.createElement("div");
          marker.className="progression-section-marker";
          var markerText=document.createElement("span");
          markerText.textContent=songSectionDisplayName(songStep.sectionBefore);
          marker.appendChild(markerText);
          host.appendChild(marker);
        }

        var chip = document.createElement("div");
        chip.className = "prog-chip " + (progressionStepIsDiatonic(prog,i,mode) ? "in-key" : "out-key");
        if(songStep && songStep.info && songStep.info.midiNotes && songStep.info.midiNotes.length>5) {
          chip.className += " song-wide";
        }

        // While stopped, any progression chip toggles the whole strip between
        // Roman numerals and actual chord names.
        if (!progressionPlaying) {
          chip.className += " view-toggle";
          chip.setAttribute("role", "button");
          chip.setAttribute("aria-label", stoppedDisplayState === 0 ? "Show chord names" : "Show independent circle");
          bindProgressionBeatLongPress(chip, i);
          chip.addEventListener("click", function(ev){
            // A completed long press opens the beat editor and must not also
            // advance the three-state notation view when the finger lifts.
            if (ev.currentTarget._suppressNextClick) {
              ev.currentTarget._suppressNextClick = false;
              ev.stopPropagation();
              return;
            }
            // Prevent this same click from bubbling to the progression-strip
            // handler that is installed when state 2 (blank/independent) renders.
            ev.stopPropagation();
            beatEditorState = null;
            if (activeSong) setStoppedDisplayState(stoppedDisplayState === 0 ? 1 : 0);
            else toggleChordLetterView();
          });
        }

        // Current chord remains steadily highlighted.
        if (activeIndex !== null && activeIndex !== undefined && i === activeIndex) {
          chip.className += " active";
          if (progressionPlaying) {
            chip.className += " hold-target";
            chip.setAttribute("role", "button");
            chip.setAttribute("aria-label", harmonyHoldActive ? "Release chord hold" : "Hold current chord");
            (function(index){
              chip.addEventListener("click", function(){
                if (index === activeIndex) toggleHarmonyHoldForCurrentChord();
              });
            })(i);
          }
        }

        // The upcoming chord gets the old off→on cue instead.
        // On the penultimate beat cueLit is false; on the final beat it is true.
        if (cueLit === true &&
            cueIndex !== null &&
            cueIndex !== undefined &&
            cueIndex !== activeIndex &&
            i === cueIndex) {
          chip.className += " next-cue";
        }

        var quality=document.createElement("div");
        quality.className="chord-quality";
        quality.textContent=songStep ? songQualityLabel(songStep) : "";
        chip.appendChild(quality);

        var roman=document.createElement("div");
        roman.textContent = songStep
          ? songMiddleLabel(songStep, chordLetterView && !progressionPlaying)
          : ((chordLetterView && !progressionPlaying)
              ? chordNameForDegree(d)
              : (modeReferenceView
                  ? romanLabelForChordRelativeToParent(d, mode)
                  : normalizedDegreeLabel(d)));
        chip.appendChild(roman);

        var triadIntervals = songStep ? songIntervalDisplay(songStep) : triadIntervalDisplayForDegree(d,mode);
        if (triadIntervals.length) {
          var intervalRow = document.createElement("div");
          intervalRow.className = "triad-intervals";

          triadIntervals.forEach(function(item, idx){
            var interval = document.createElement("span");
            interval.className = "triad-interval " + (item.diatonic ? "diatonic" : "nondiatonic");
            interval.textContent = item.label;
            intervalRow.appendChild(interval);

            if (idx < triadIntervals.length - 1) {
              var spacer = document.createElement("span");
              spacer.className = "triad-interval-space";
              spacer.textContent = " ";
              intervalRow.appendChild(spacer);
            }
          });

          chip.appendChild(intervalRow);
        }
        if (!prog.isSong) attachBeatEditor(chip, i);
        host.appendChild(chip);
      }

      updateProgressionStripViewport(
        host, prog, activeIndex, cueIndex, cueLit, savedScrollLeft, sameSelection
      );
    }

    function progressionChordClasses() {
      var prog = getSelectedProgression(), inPC = {}, outPC = {};
